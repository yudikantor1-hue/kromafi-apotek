          <template x-if="page === 'stok opname'">
            <div x-data="stokOpnamePage()" class="mx-auto max-w-4xl space-y-4 text-sm">
              <div x-show="toastMessage" x-transition class="fixed right-3 top-3 z-[90] max-w-[calc(100vw-1.5rem)] rounded-lg bg-brand-primary px-4 py-3 text-sm font-semibold text-white shadow-lg" x-text="toastMessage"></div>
              <p x-show="loadError" class="rounded-std border border-brand-error/20 bg-brand-surface p-4 text-sm text-brand-error" x-text="loadError"></p>

              <template x-if="!selectedProduct">
                <section class="overflow-hidden rounded-container border border-brand-border bg-brand-surface shadow-card">
                  <div class="divide-y divide-brand-border">
                    <template x-for="product in visibleProducts" :key="productId(product)">
                      <button type="button" @click="openDetail(product)" class="flex min-h-16 w-full flex-col items-start justify-center px-4 py-3 text-left transition hover:bg-brand-bg sm:px-6">
                        <span class="break-words font-semibold text-brand-text" x-text="productName(product)"></span>
                        <span class="mt-1 font-tabular text-brand-secondary" x-text="formatRibuan(productStock(product)) + ' ' + productUnit(product)"></span>
                      </button>
                    </template>
                    <p x-show="!loadError && sortedProducts.length === 0" class="p-6 text-center text-sm text-brand-secondary" x-text="activeProducts.length ? 'Semua barang aktif sudah di-opname bulan ini.' : 'Belum ada barang aktif.'"></p>
                  </div>
                  <div x-show="hasMore" class="flex justify-center border-t border-brand-border bg-brand-bg p-4">
                    <button type="button" @click="loadMore()" class="h-10 rounded-full border border-brand-border bg-brand-surface px-5 text-sm font-bold text-brand-primary shadow-card transition hover:bg-brand-primary-tint">Load more</button>
                  </div>
                </section>
              </template>

              <template x-if="selectedProduct">
                <section class="overflow-hidden rounded-container border border-brand-border bg-brand-surface shadow-card">
                  <div class="flex min-w-0 items-center gap-2 border-b border-brand-border bg-brand-bg p-3 sm:p-4">
                    <button type="button" @click="closeDetail()" aria-label="Kembali" class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-std text-brand-secondary transition hover:bg-white">
                      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                    </button>
                    <h3 class="min-w-0 flex-1 break-words text-base font-bold text-brand-text" x-text="productName(selectedProduct)"></h3>
                  </div>
                  <form @submit.prevent="saveOpname()" class="space-y-4 p-4 sm:p-5">
                    <label class="block text-sm font-semibold text-brand-text">Stok aplikasi
                      <div class="mt-1 flex min-w-0 items-center gap-2">
                        <input type="text" readonly :value="formatRibuan(productStock(selectedProduct))" class="h-11 min-w-0 flex-1 rounded-std border border-brand-border bg-brand-bg px-3 text-right font-tabular text-sm text-brand-text">
                        <span class="shrink-0 text-sm font-medium text-brand-secondary" x-text="productUnit(selectedProduct)"></span>
                      </div>
                    </label>
                    <label class="block text-sm font-semibold text-brand-text">Stok riil
                      <div class="mt-1 flex min-w-0 items-center gap-2">
                        <input type="number" inputmode="decimal" min="0" step="any" x-model="stokRiil" required class="h-11 min-w-0 flex-1 rounded-std border border-brand-border bg-brand-surface px-3 text-right font-tabular text-sm font-normal text-brand-text focus-ring">
                        <span class="shrink-0 text-sm font-medium text-brand-secondary" x-text="productUnit(selectedProduct)"></span>
                      </div>
                    </label>
                    <div class="flex items-center justify-between gap-3 border-y border-brand-border py-3 text-sm">
                      <span class="font-semibold text-brand-text">Selisih</span>
                      <span class="font-tabular font-bold" :class="difference < 0 ? 'text-brand-error' : difference > 0 ? 'text-brand-success' : 'text-brand-secondary'" x-text="difference === null ? '-' : (difference > 0 ? '+' : '') + formatRibuan(difference) + ' ' + productUnit(selectedProduct)"></span>
                    </div>
                    <p x-show="formError" class="text-sm text-brand-error" x-text="formError"></p>
                    <div class="flex justify-end gap-2 border-t border-brand-border pt-3">
                      <button type="button" @click="closeDetail()" class="h-10 rounded-action border border-brand-border px-4 text-sm font-semibold text-brand-secondary transition hover:bg-brand-bg">Batal</button>
                      <button type="submit" class="h-10 rounded-action bg-brand-primary px-5 text-sm font-bold text-white shadow-card transition hover:bg-brand-primary-dark">Selesai</button>
                    </div>
                  </form>
                </section>
              </template>
            </div>
          </template>
