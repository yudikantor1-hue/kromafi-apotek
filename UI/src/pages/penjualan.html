                      <div class="relative" @click.away="if (openDropdown === 'namaDokter') closeDropdown()" @keydown.escape.stop.prevent="closeDropdown()">
                        <span class="block text-xs font-semibold">Dokter</span>
                        <button type="button" role="combobox" :aria-expanded="openDropdown === 'namaDokter'" @click="toggleDropdown('namaDokter')" class="mt-1 flex min-h-10 w-full items-center justify-between gap-2 rounded-std border border-brand-border bg-brand-surface px-3 py-2 text-left text-sm focus-ring">
                          <span class="min-w-0 truncate" :class="formData.namaDokter ? 'text-brand-text' : 'text-brand-secondary'" x-text="formData.namaDokter || 'Pilih dokter'"></span>
                          <svg class="h-4 w-4 shrink-0 text-brand-secondary" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M5.22 7.47a.75.75 0 011.06 0L10 11.19l3.72-3.72a.75.75 0 111.06 1.06l-4.25 4.25a.75.75 0 01-1.06 0L5.22 8.53a.75.75 0 010-1.06z" clip-rule="evenodd"/></svg>
                        </button>
                        <div x-show="openDropdown === 'namaDokter'" x-transition.opacity role="listbox" class="absolute left-0 top-full z-50 mt-1 max-h-60 w-full overflow-y-auto rounded-md border border-brand-border bg-white p-1 text-sm text-brand-text shadow-lg">
                          <button type="button" role="option" aria-selected="false" @click="formData.namaDokter = ''; closeDropdown()" class="min-h-10 w-full rounded px-3 py-2 text-left text-sm text-brand-secondary hover:bg-brand-bg">Pilih dokter</button>
                          <template x-for="doctor in doctorOptions" :key="doctor.id"><button type="button" role="option" :aria-selected="formData.namaDokter === doctor.nama" @click="formData.namaDokter = doctor.nama; closeDropdown()" class="min-h-10 w-full rounded px-3 py-2 text-left text-sm" x-text="doctor.nama"></button></template>
                        </div>
                      </div>
                    </div>
                    <label class="block text-xs font-semibold">Petugas<input type="text" readonly :value="activeStaffName" class="mt-1 h-10 w-full px-3 border border-brand-border rounded-std bg-brand-bg text-sm font-normal"></label>
                    <label class="block text-xs font-semibold">Catatan<textarea x-model="formData.catatan" rows="3" class="mt-1 w-full px-3 py-2 border border-brand-border rounded-std text-sm font-normal focus-ring" placeholder="Catatan"></textarea></label>
                    <p x-show="formError" class="text-xs text-red-600" x-text="formError"></p>
                    <div class="pt-3 border-t border-brand-border flex justify-end gap-2"><button type="button" @click="closeForm()" class="h-9 px-4 border border-brand-border rounded-action text-xs font-semibold text-brand-secondary">Cancel</button><button type="submit" class="h-9 px-5 bg-brand-accent text-white rounded-action text-xs font-bold shadow-card">Save</button></div>
                  </form>
                </div>
              </div>

              <div x-show="isLineFormOpen" x-transition.opacity @click.stop="if ($event.target === $el) closeLineForm(); if (!$event.target.closest('[data-sale-product-search]')) autocompleteOpen = false" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
                <div x-ref="saleLineScroll" @click.away="closeLineForm()" class="bg-brand-surface rounded-container border border-brand-border shadow-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto">
                  <div class="p-4 border-b border-brand-border bg-brand-bg flex items-center gap-2"><button @click="closeLineForm()" class="p-1 text-brand-secondary" title="Kembali"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg></button><h3 class="text-sm font-bold" x-text="lineFormIndex === null ? 'Tambah item' : 'Edit item'"></h3></div>
                  <form @submit.prevent="saveLine()" class="p-4 sm:p-5 space-y-4">
                    <div class="relative" data-sale-product-search>
                      <label for="sale-product-search" class="block text-xs font-semibold">Nama item <span class="text-brand-error">*</span></label>
                      <input id="sale-product-search" type="search" x-model="lineForm.nama" @focus="autocompleteOpen = true" @click="autocompleteOpen = true" @input="autocompleteOpen = true; syncSelectedItem()" @change="syncSelectedItem()" @keydown.escape.stop.prevent="autocompleteOpen = false" autocomplete="off" required class="mt-1 h-10 w-full px-3 border border-brand-border rounded-std text-sm font-normal focus-ring" placeholder="Ketik nama item">
                      <div x-show="autocompleteOpen" role="listbox" class="absolute z-20 mt-1 max-h-[200px] w-full overflow-y-auto rounded-md border border-brand-border bg-white p-1 text-brand-text shadow-lg">
                        <template x-for="item in filteredItemOptions" :key="item.jenis + '-' + item.id">
                          <button type="button" role="option" @click.prevent="selectItem(item)" class="w-full rounded px-3 py-2 text-left text-sm hover:bg-brand-bg">
                            <span class="flex items-center justify-between gap-2">
                              <span class="min-w-0 truncate" x-text="item.nama"></span>
                              <span class="shrink-0 text-[10px] font-semibold px-2 py-0.5 rounded-full" :class="item.jenis === 'jasa' ? 'bg-purple-100 text-purple-700' : 'bg-brand-primary-tint text-brand-primary'" x-text="item.jenis === 'jasa' ? 'Jasa' : 'Barang'"></span>
                            </span>
                            <span x-show="item.jenis !== 'jasa'" class="mt-0.5 block text-[11px] font-normal text-brand-secondary" x-text="itemStockInfo(item)"></span>
                          </button>
                        </template>
                        <div x-show="filteredItemOptions.length === 0" class="px-3 py-2 text-sm text-brand-secondary">Item tidak ditemukan</div>
                      </div>
                    </div>
                    <div x-show="lineForm.jenis !== 'jasa'" class="grid grid-cols-2 gap-3 rounded-std bg-brand-bg px-3 py-2 text-xs">
                      <div class="font-semibold">Stok<span class="mt-0.5 block font-tabular font-normal text-brand-secondary" x-text="selectedProductStok"></span></div>
                      <div class="font-semibold">Lemari<span class="mt-0.5 block font-normal text-brand-secondary" x-text="selectedProductLemari"></span></div>
                    </div>
                    <label class="block text-xs font-semibold">Jumlah <span class="text-brand-error">*</span><input type="text" inputmode="numeric" :value="lineForm.jumlah" @focus="$event.target.select()" @input="formatMoneyInput($event, 'jumlah')" required placeholder="0" class="mt-1 h-10 w-full px-3 border border-brand-border rounded-std text-sm font-normal focus-ring"></label>
                    <div class="grid grid-cols-2 gap-3 text-xs"><div class="font-semibold">Harga jual<div class="mt-1 h-10 flex items-center rounded-std bg-brand-bg px-3 font-tabular" x-text="selectedProduct || selectedService ? formatHarga(lineForm.hargaJual) : 'Rp 0'"></div></div><div class="font-semibold">Tagihan<div class="mt-1 h-10 flex items-center rounded-std bg-brand-bg px-3 font-tabular" x-text="formatHarga(lineTotal)"></div></div></div>
                    <label class="block text-xs font-semibold">Diskon tagihan<input type="text" inputmode="numeric" :value="lineForm.diskonTagihan" @focus="$event.target.select()" @input="formatMoneyInput($event, 'diskonTagihan')" placeholder="0" class="mt-1 h-10 w-full px-3 border border-brand-border rounded-std text-sm font-normal focus-ring"></label>
                    <div class="flex justify-between gap-3 rounded-std bg-brand-bg px-3 py-2 text-xs font-semibold"><span>Tagihan final</span><span class="font-tabular" x-text="formatHarga(lineFinal)"></span></div>
                    <label x-show="lineForm.jenis !== 'jasa'" class="block text-xs font-semibold">Batch<input type="text" x-model="lineForm.batch" class="mt-1 h-10 w-full px-3 border border-brand-border rounded-std text-sm font-normal focus-ring" placeholder="Batch"></label>
                    <p x-show="lineFormError" class="text-xs text-red-600" x-text="lineFormError"></p>
                    <div class="pt-3 border-t border-brand-border flex justify-end gap-2"><button type="button" @click="closeLineForm()" class="h-9 px-4 border border-brand-border rounded-action text-xs font-semibold text-brand-secondary">Cancel</button><button type="submit" class="h-9 px-5 bg-brand-accent text-white rounded-action text-xs font-bold">Save</button></div>
                  </form>
                </div>
              </div>
            </div>
          </template>
