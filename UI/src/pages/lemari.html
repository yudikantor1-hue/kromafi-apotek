          <template x-if="page === 'lemari'">
            <div x-data="lemariPage()" @open-lemari-form.window="openForm()" class="max-w-4xl mx-auto space-y-6">
              
              <!-- Filter Card (Dropdown Select per UI.md: [(Semua)/Aktif/Tidak aktif v]) -->
              <div class="bg-brand-surface rounded-container border border-brand-border p-3 shadow-card flex items-center justify-between">
                <div class="w-full sm:w-64">
                  <select x-model="filter" class="w-full h-10 min-h-10 px-3 py-2 bg-brand-surface border border-brand-border rounded-std text-sm text-brand-text focus-ring font-medium">
                    <option value="semua">Semua</option>
                    <option value="aktif">Aktif</option>
                    <option value="tidak aktif">Tidak aktif</option>
                  </select>
                </div>
              </div>

              <!-- List Lemari -->
              <div class="bg-brand-surface rounded-container border border-brand-border shadow-card overflow-hidden">
                <div class="divide-y divide-brand-border">
                  <template x-for="l in visibleLemari" :key="l.id">
                    <div @click="openDetail(l)" class="p-4 sm:px-6 flex items-center justify-between hover:bg-brand-primary-tint/30 transition-colors cursor-pointer group">
                      <span class="font-bold text-sm text-brand-text group-hover:text-brand-primary transition" x-text="l.nama"></span>
                      <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold border" 
                            :class="l.status === 'Aktif' ? 'bg-green-100 text-green-700 border-green-200' : 'bg-red-100 text-red-700 border-red-200'"
                            x-text="l.status">
                      </span>
                    </div>
                  </template>
                  <template x-if="visibleLemari.length === 0">
                    <div class="p-8 text-center text-xs text-brand-secondary">
                      Tidak ada lemari yang ditemukan.
                    </div>
                  </template>
                </div>

                <!-- Load More Button -->
                <div class="p-4 border-t border-brand-border bg-brand-bg flex justify-center">
                  <button @click="loadMore()" :disabled="!hasMore" :title="hasMore ? 'Tampilkan lemari berikutnya' : 'Semua lemari sudah ditampilkan'" class="h-9 px-5 border border-brand-border rounded-full text-xs font-bold text-brand-primary bg-brand-surface hover:bg-brand-primary-tint transition shadow-card disabled:cursor-not-allowed disabled:opacity-50">
                    Load more
                  </button>
                </div>
              </div>

              <!-- DETAIL LEMARI POP UP MODAL -->
              <div x-show="isDetailOpen" 
                   x-transition.opacity
                   class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div @click.away="closeDetail()" 
                     class="bg-brand-surface rounded-container border border-brand-border shadow-2xl max-w-sm w-full overflow-hidden animate-in fade-in zoom-in-95 duration-200">
                  
                  <!-- Modal Header -->
                  <div class="p-4 border-b border-brand-border bg-brand-bg flex items-center justify-between">
                    <div class="flex items-center gap-2">
                      <button @click="closeDetail()" class="p-1 text-brand-secondary hover:text-brand-text rounded-std transition" title="Back">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                        </svg>
                      </button>
                      <h3 class="font-bold text-sm text-brand-text truncate max-w-[180px]" x-text="selectedLemari ? selectedLemari.nama : ''"></h3>
                    </div>
                    <button @click="openForm(selectedLemari)" class="h-8 px-3 bg-brand-primary hover:bg-brand-primary-dark text-white rounded-action text-xs font-bold transition shadow-card">
                      edit
                    </button>
                  </div>

                  <!-- Modal Body -->
                  <div class="p-5 space-y-3 text-xs sm:text-sm">
                    <div class="flex items-center">
                      <span class="w-32 text-brand-secondary font-medium">Nama lemari</span>
                      <span class="font-bold text-brand-text" x-text="': ' + (selectedLemari ? selectedLemari.nama : '')"></span>
                    </div>
                    <div class="flex items-center">
                      <span class="w-32 text-brand-secondary font-medium">Status</span>
                      <span class="font-bold" :class="selectedLemari && selectedLemari.status === 'Aktif' ? 'text-green-600' : 'text-red-600'" x-text="': ' + (selectedLemari ? selectedLemari.status : '')"></span>
                    </div>
                  </div>
                </div>
              </div>

              <!-- FORMULIR LEMARI POP UP MODAL -->
              <div x-show="isFormOpen" 
                   x-transition.opacity
                   class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div @click.away="closeForm()" 
                     class="bg-brand-surface rounded-container border border-brand-border shadow-2xl max-w-sm w-full overflow-hidden animate-in fade-in zoom-in-95 duration-200">
                  
                  <!-- Modal Header -->
                  <div class="p-4 border-b border-brand-border bg-brand-bg flex items-center gap-2">
                    <button @click="closeForm()" class="p-1 text-brand-secondary hover:text-brand-text rounded-std transition" title="Back">
                      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                      </svg>
                    </button>
                    <h3 class="font-bold text-sm text-brand-text" x-text="formData.id ? 'Edit lemari' : 'Tambah lemari'"></h3>
                  </div>

                  <!-- Modal Form Body -->
                  <form @submit.prevent="saveLemari()" class="p-5 space-y-4">
                    <div class="space-y-3 text-xs sm:text-sm">
                      <div>
                        <label class="block font-medium text-brand-text mb-1">Nama lemari :</label>
                        <input type="text" x-model="formData.nama" required class="w-full h-10 px-3 bg-brand-surface border border-brand-border rounded-std text-sm text-brand-text focus-ring" placeholder="Masukkan nama lemari">
                      </div>
                      <div>
                        <label class="block font-medium text-brand-text mb-1">Status :</label>
                        <div class="flex items-center gap-6 py-1">
                          <label class="inline-flex items-center gap-2 cursor-pointer">
                            <input type="radio" value="Aktif" x-model="formData.status" class="text-brand-primary focus-ring h-4 w-4">
                            <span class="font-medium text-brand-text">Aktif</span>
                          </label>
                          <label class="inline-flex items-center gap-2 cursor-pointer">
                            <input type="radio" value="Tidak aktif" x-model="formData.status" class="text-brand-primary focus-ring h-4 w-4">
                            <span class="font-medium text-brand-text">Tidak aktif</span>
                          </label>
                        </div>
                      </div>
                    </div>

                    <!-- Modal Actions -->
                    <div class="pt-3 border-t border-brand-border flex items-center justify-end gap-2">
                      <button type="button" @click="closeForm()" class="h-9 px-4 border border-brand-border rounded-action text-xs font-semibold text-brand-secondary hover:bg-brand-bg transition">
                        Cancel
                      </button>
                      <button type="submit" class="h-9 px-5 bg-brand-accent hover:bg-[#E85A2E] text-white rounded-action text-xs font-bold transition shadow-card">
                        Save
                      </button>
                    </div>
                  </form>
                </div>
              </div>

            </div>
          </template>
          
          <!-- ======================= -->
          <!-- 6. HALAMAN METODE PEMBAYARAN -->
          <!-- ======================= -->
