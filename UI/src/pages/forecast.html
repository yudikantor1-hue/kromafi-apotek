          <template x-if="page === 'forecast'">
            <div x-data="forecastPage()" class="max-w-4xl mx-auto space-y-5 sm:space-y-6">
              <!-- Filter Card -->
              <div class="rounded-container border border-brand-border bg-brand-surface p-4 sm:p-5 shadow-card space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <label class="block text-xs font-semibold text-brand-text">Dari tanggal
                    <div x-data="compactDatePicker()" x-modelable="value" x-model="filterFrom" @date-picker-change="onFilterChange()" class="mt-1"></div>
                  </label>
                  <label class="block text-xs font-semibold text-brand-text">Sampai tanggal
                    <div x-data="compactDatePicker()" x-modelable="value" x-model="filterTo" @date-picker-change="onFilterChange()" class="mt-1"></div>
                  </label>
                </div>

                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pt-2 border-t border-brand-border">
                  <div>
                    <button type="button" @click="processForecast()" :disabled="!isValidDateRange" :class="isStale ? 'bg-brand-accent hover:bg-[#E85A2E] text-white shadow-card font-bold' : 'bg-brand-bg text-brand-secondary border border-brand-border hover:bg-brand-primary-tint/50 font-medium'" class="h-9 px-5 text-xs rounded-action transition disabled:opacity-50 disabled:cursor-not-allowed">
                      Proses
                    </button>
                    <p x-show="dateRangeError" class="mt-1 text-xs text-brand-error" x-text="dateRangeError"></p>
                  </div>
                </div>
              </div>

              <!-- Search Field -->
              <div class="rounded-container border border-brand-border bg-brand-surface p-3 sm:p-4 shadow-card space-y-3">
                <div>
                  <label class="block text-xs font-semibold text-brand-text mb-1">Cari nama barang</label>
                  <input type="search" x-model="searchQuery" placeholder="Ketik nama barang" aria-label="Cari nama barang" class="h-10 w-full px-3 bg-brand-surface border border-brand-border rounded-std text-sm text-brand-text focus-ring">
                </div>
              </div>

              <!-- List Item Forecast -->
              <div class="bg-brand-surface rounded-container border border-brand-border shadow-card overflow-hidden">
                <div class="divide-y divide-brand-border">
                  <template x-for="item in visibleItems" :key="item.id + '-' + item.nama">
                    <div class="p-4 sm:px-6 hover:bg-brand-primary-tint/30 transition-colors">
                      <div class="font-bold text-sm text-brand-text" x-text="item.nama"></div>
                      <div class="mt-2 grid grid-cols-1 sm:grid-cols-3 gap-1.5 text-xs text-brand-secondary">
                        <div>Ketahanan : <strong class="font-bold font-tabular" :class="item.ketahananHari <= 7 && !item.isInfinite ? 'text-brand-error' : 'text-brand-text'" x-text="formatKetahanan(item)"></strong></div>
                        <div>Stok : <strong class="font-semibold text-brand-text font-tabular" x-text="formatRibuan(item.stok) + ' ' + item.satuan"></strong></div>
                        <div>Kebutuhan : <strong class="font-semibold text-brand-text font-tabular" x-text="formatKebutuhan(item)"></strong></div>
                      </div>
                    </div>
                  </template>
                  <template x-if="visibleItems.length === 0">
                    <div class="p-8 text-center text-xs text-brand-secondary" x-text="hasProcessed ? 'Tidak ada data barang forecast.' : 'Tekan tombol proses untuk menampilkan data Forecast.'"></div>
                  </template>
                </div>
                <div class="p-4 border-t border-brand-border bg-brand-bg flex justify-center">
                  <button @click="loadMore()" :disabled="!hasMore" :title="hasMore ? 'Tampilkan item berikutnya' : 'Semua item sudah ditampilkan'" class="h-9 px-5 border border-brand-border rounded-full text-xs font-bold text-brand-primary bg-brand-surface hover:bg-brand-primary-tint transition shadow-card disabled:cursor-not-allowed disabled:opacity-50">Load more</button>
                </div>
              </div>
            </div>
          </template>
