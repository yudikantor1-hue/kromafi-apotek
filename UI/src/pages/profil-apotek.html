          <template x-if="page === 'profil apotek'">
            <div x-data="profilApotekPage()" class="max-w-xl mx-auto space-y-6">
              <!-- Toast Notification -->
              <template x-if="toastMessage">
                <div role="status" aria-label="Konfirmasi berhasil" class="fixed top-5 right-5 z-50 flex h-10 w-10 items-center justify-center rounded-full bg-emerald-600 text-white shadow-lg transition-all">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" d="M16.704 5.29a1 1 0 010 1.415l-7.25 7.25a1 1 0 01-1.415 0l-3.5-3.5a1 1 0 011.415-1.415l2.792 2.793 6.543-6.543a1 1 0 011.415 0z" clip-rule="evenodd" />
                  </svg>
                </div>
              </template>

              <!-- Form Card per UI.md specification -->
              <div class="bg-brand-surface rounded-container border border-brand-border p-5 sm:p-6 shadow-card space-y-5">
                <form @submit.prevent="save()" class="space-y-4">
                  <!-- Nama Apotek -->
                  <div class="space-y-1 text-xs sm:text-sm">
                    <label class="block font-medium text-brand-text mb-1">Nama apotek :</label>
                    <input type="text" 
                           x-model="formData.name" 
                           :disabled="!isAdmin || isLoading"
                           required
                           class="w-full h-10 px-3 bg-brand-surface border border-brand-border rounded-std text-sm text-brand-text focus-ring disabled:cursor-not-allowed disabled:bg-brand-bg" 
                           placeholder="Masukkan nama apotek">
                    <template x-if="errors.name">
                      <p class="text-[12px] text-brand-error mt-1" x-text="errors.name"></p>
                    </template>
                  </div>

                  <!-- Alamat Apotek -->
                  <div class="space-y-1 text-xs sm:text-sm">
                    <label class="block font-medium text-brand-text mb-1">Alamat :</label>
                    <textarea rows="3" 
                              x-model="formData.address" 
                              :disabled="!isAdmin || isLoading"
                              class="w-full p-3 bg-brand-surface border border-brand-border rounded-std text-sm text-brand-text focus-ring disabled:cursor-not-allowed disabled:bg-brand-bg" 
                              placeholder="Masukkan alamat apotek"></textarea>
                  </div>

                  <!-- Actions [Cancel] [Save] -->
                  <p x-show="!isAdmin" class="border-t border-brand-border pt-3 text-xs text-brand-secondary">Profil apotek hanya dapat diubah oleh admin.</p>
                  <div x-show="isAdmin" class="pt-4 border-t border-brand-border flex items-center justify-end gap-2">
                    <button type="button" 
                            @click="reset()" 
                            :disabled="isLoading"
                            class="h-9 px-4 border border-brand-border rounded-action text-xs font-semibold text-brand-secondary hover:bg-brand-bg transition">
                      Cancel
                    </button>
                    <button type="submit" 
                            :disabled="isLoading"
                            class="h-9 px-5 bg-brand-accent hover:bg-[#E85A2E] text-white rounded-action text-xs font-bold transition shadow-card flex items-center gap-2">
                      <template x-if="isLoading">
                        <svg class="animate-spin h-3.5 w-3.5 text-white" fill="none" viewBox="0 0 24 24">
                          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                        </svg>
                      </template>
                      Save
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </template>
