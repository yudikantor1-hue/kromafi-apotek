                      <input id="faktur-product-search" type="search" x-model="lineForm.nama" @focus="autocompleteOpen = true" @click="autocompleteOpen = true" @input="autocompleteOpen = true; syncSelectedProduct()" @change="syncSelectedProduct()" @keydown.escape.stop.prevent="autocompleteOpen = false" autocomplete="off" required maxlength="100" class="mt-1 w-full h-10 px-3 bg-brand-surface border border-brand-border rounded-std text-sm font-normal focus-ring" placeholder="Ketik nama barang">
                      <div x-show="autocompleteOpen" x-transition.opacity role="listbox" class="absolute left-0 top-full z-50 mt-1 max-h-60 w-full overflow-y-auto rounded-md border border-brand-border bg-white p-1 text-sm text-brand-text shadow-lg">
                        <template x-for="product in filteredProductOptions" :key="product.id">
                          <button type="button" role="option" @click.prevent="selectProduct(product)" class="min-h-10 w-full rounded px-3 py-2 text-left text-sm text-brand-text hover:bg-brand-bg focus:bg-brand-bg focus:outline-none" x-text="product.nama"></button>
                        </template>
                        <div x-show="filteredProductOptions.length === 0" class="px-3 py-2 text-sm text-brand-secondary">Barang tidak ditemukan</div>
                      </div>
                    </div>
                    <div x-show="hasHargaModalLama || hasHargaJualLama" class="space-y-1 text-xs text-brand-secondary">
                      <div x-show="hasHargaModalLama" x-text="'Harga modal lama : ' + formatHarga(hargaModalLama)"></div>
                      <div x-show="hasHargaJualLama" x-text="'Harga jual lama  : ' + formatHarga(hargaJualLama)"></div>
                    </div>
                    <fieldset class="text-xs font-semibold"><legend>Kemasan <span class="text-brand-error">*</span></legend><div class="mt-2 flex gap-5"><label class="inline-flex items-center gap-2 font-normal"><input type="radio" value="satu unit" x-model="lineForm.kemasan" class="h-4 w-4 text-brand-primary">Satu unit</label><label class="inline-flex items-center gap-2 font-normal"><input type="radio" value="per box" x-model="lineForm.kemasan" class="h-4 w-4 text-brand-primary">Per box</label></div></fieldset>
                    <div x-show="lineForm.kemasan === 'per box'" class="grid grid-cols-2 gap-3"><label class="block text-xs font-semibold">Berapa box <span class="text-brand-error">*</span><input type="text" inputmode="numeric" :value="lineForm.jumlahBox" @focus="$event.target.select()" @input="formatRibuanInput($event, 'jumlahBox')" :required="lineForm.kemasan === 'per box'" class="mt-1 w-full h-10 px-3 border border-brand-border rounded-std text-sm font-normal focus-ring" placeholder="0"></label><label class="block text-xs font-semibold">Isi per box <span class="text-brand-error">*</span><input type="text" inputmode="numeric" :value="lineForm.isiPerBox" @focus="$event.target.select()" @input="formatRibuanInput($event, 'isiPerBox')" :required="lineForm.kemasan === 'per box'" class="mt-1 w-full h-10 px-3 border border-brand-border rounded-std text-sm font-normal focus-ring" placeholder="0"></label><div class="col-span-2 text-xs font-semibold">Jumlah unit<div class="mt-1 h-10 flex items-center px-3 rounded-std bg-brand-bg font-tabular" x-text="formatRibuan(computedLineQuantity) + ' ' + (lineForm.satuan || '')"></div></div></div>
                    <div x-show="lineForm.kemasan === 'satu unit'"><label class="block text-xs font-semibold">Jumlah <span class="text-brand-error">*</span><input type="text" inputmode="numeric" :value="lineForm.jumlah" @focus="$event.target.select()" @input="formatRibuanInput($event, 'jumlah')" :required="lineForm.kemasan === 'satu unit'" class="mt-1 w-full h-10 px-3 border border-brand-border rounded-std text-sm font-normal focus-ring" placeholder="0"></label></div>
                    <label class="block text-xs font-semibold"><span x-text="lineForm.kemasan === 'per box' ? 'Harga satu box *' : 'Harga satu unit isi *'"></span><input type="text" inputmode="numeric" :value="lineForm.hargaBeli" @focus="$event.target.select()" @input="formatRibuanInput($event, 'hargaBeli')" required class="mt-1 w-full h-10 px-3 border border-brand-border rounded-std text-sm font-normal focus-ring" placeholder="0"></label>
                    <div class="grid grid-cols-2 gap-3"><label class="block text-xs font-semibold">Diskon (%)<input type="text" inputmode="numeric" :value="lineForm.diskon" @focus="$event.target.select()" @input="formatPersenInput($event, 'diskon')" class="mt-1 w-full h-10 px-3 border border-brand-border rounded-std text-sm font-normal focus-ring" placeholder="0"></label><label class="block text-xs font-semibold">PPN (%)<input type="text" inputmode="numeric" :value="lineForm.ppn" @focus="$event.target.select()" @input="formatPersenInput($event, 'ppn')" class="mt-1 w-full h-10 px-3 border border-brand-border rounded-std text-sm font-normal focus-ring" placeholder="0"></label></div>
                    <div class="grid grid-cols-2 gap-3"><div class="text-xs font-semibold">Tagihan<div class="mt-1 h-10 flex items-center px-3 rounded-std bg-brand-bg font-tabular" x-text="formatHarga(computedLineTotal)"></div></div><div class="text-xs font-semibold">Harga modal<div class="mt-1 h-10 flex items-center px-3 rounded-std bg-brand-bg font-tabular" x-text="formatHarga(computedModalPrice)"></div></div></div>
                    <div class="grid grid-cols-2 gap-3"><label class="block text-xs font-semibold">Margin (%)<input type="text" inputmode="numeric" :value="lineForm.margin" @focus="$event.target.select()" @input="formatPersenInput($event, 'margin')" class="mt-1 w-full h-10 px-3 border border-brand-border rounded-std text-sm font-normal focus-ring" placeholder="0"></label><label class="block text-xs font-semibold">Harga jual <span class="text-brand-error">*</span><input type="text" inputmode="numeric" :value="lineForm.hargaJual" @focus="$event.target.select()" @input="lineFormError = ''; isHargaJualEdited = true; formatRibuanInput($event, 'hargaJual')" @invalid="lineFormError = 'Harga jual wajib diisi'" @change="roundManualHargaJual($event)" required class="mt-1 w-full h-10 px-3 border border-brand-border rounded-std text-sm font-normal focus-ring" placeholder="0"></label></div>
                    <div class="grid grid-cols-2 gap-3"><label class="block text-xs font-semibold">Tanggal expired<div x-data="compactDatePicker()" x-modelable="value" x-model="lineForm.tanggalExpired" class="mt-1"></div></label><label class="block text-xs font-semibold">Batch<input type="text" maxlength="80" x-model="lineForm.batch" class="mt-1 w-full h-10 px-3 border border-brand-border rounded-std text-sm font-normal focus-ring"></label></div>
                    <p x-show="lineFormError" class="text-xs text-brand-error" x-text="lineFormError"></p>
                    <div class="pt-3 border-t border-brand-border flex justify-end gap-2"><button type="button" @click="closeLineForm()" class="h-9 px-4 border border-brand-border rounded-action text-xs font-semibold text-brand-secondary">Cancel</button><button type="submit" class="h-9 px-5 bg-brand-accent text-white rounded-action text-xs font-bold">Simpan barang</button></div>
                  </form>
                </div>
              </div>

              <div x-show="isLineDetailOpen" x-transition.opacity @click.self="closeLineDetail()" @click.stop class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-[70] flex items-center justify-center p-4">
                <div @click.away="closeLineDetail()" class="bg-brand-surface rounded-container border border-brand-border shadow-2xl max-w-sm w-full overflow-hidden"><div class="p-4 border-b border-brand-border bg-brand-bg flex items-center gap-2"><button @click="closeLineDetail()" class="p-1 text-brand-secondary" title="Kembali"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg></button><h3 class="font-bold text-sm" x-text="selectedLine ? selectedLine.nama : ''"></h3></div><div class="p-5 space-y-3 text-xs sm:text-sm"><div class="flex justify-between gap-3"><span class="font-tabular" x-text="selectedLine ? formatHarga(selectedLine.hargaModal) + ' x ' + selectedLine.jumlah + ' ' + selectedLine.satuan : ''"></span><span class="font-bold font-tabular" x-text="selectedLine ? formatHarga(selectedLine.tagihan) : ''"></span></div><div class="border-t border-brand-border pt-3"><span class="text-brand-secondary">Expired:</span> <span class="font-semibold" x-text="selectedLine && selectedLine.tanggalExpired ? formatDate(selectedLine.tanggalExpired) : '-' "></span></div><div><span class="text-brand-secondary">Batch:</span> <span class="font-semibold" x-text="selectedLine && selectedLine.batch ? selectedLine.batch : '-' "></span></div></div></div>
              </div>
            </div>
          </template>
