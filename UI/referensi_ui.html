<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kromafi Apotek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: {
            bg: '#F6F7FB',
            surface: '#FFFFFF',
            border: '#E3E6EF',
            primary: '#3B52E0',
            'primary-dark': '#2A3BB8',
            'primary-light': '#6E80F0',
            'primary-tint': '#EEF0FE',
            accent: '#FF6A3D',
            text: '#171A2B',
            secondary: '#5B6072',
            muted: '#9AA0B4',
            disabled: '#C3C7D4',
            'disabled-bg': '#F1F2F6',
            success: '#16A34A',
            warning: '#F59E0B',
            info: '#2563EB',
            error: '#DC2626',
          }
        },
        fontFamily: {
          sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          numeric: ['Inter', 'sans-serif'],
        },
        boxShadow: {
          'card': '0 2px 8px rgba(23, 26, 43, 0.06)',
          'hover': '0 8px 24px rgba(23, 26, 43, 0.12)',
          'modal': '0 16px 48px rgba(23, 26, 43, 0.18)',
        },
        borderRadius: {
          'micro': '4px',
          'std': '8px',
          'action': '12px',
          'container': '16px',
          'dialog': '24px',
        }
      }
    }
  }
</script>

<style>
  [x-cloak] { display: none !important; }
  
  body {
    background-color: #F6F7FB;
    color: #171A2B;
    font-family: 'Plus Jakarta Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  
  .font-tabular {
    font-family: 'Inter', sans-serif;
    font-variant-numeric: tabular-nums;
  }
  
  /* Focus indicator per DESIGN.md: 1.5px solid #3B52E0 + 3px halo 20% opacity */
  .focus-ring {
    transition: all 0.15s ease-in-out;
  }
  .focus-ring:focus {
    outline: none;
    border-color: #3B52E0 !important;
    box-shadow: 0 0 0 3px rgba(59, 82, 224, 0.20) !important;
  }

  /* Custom scrollbar */
  .custom-scrollbar::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  .custom-scrollbar::-webkit-scrollbar-track {
    background: transparent;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb {
    background: #C5C5D7;
    border-radius: 9999px;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb:hover {
    background: #9AA0B4;
  }

  [role="listbox"] {
    position: absolute !important;
    top: 100% !important;
    left: 0 !important;
    z-index: 50 !important;
    width: 100% !important;
    max-height: 15rem !important;
    overflow-y: auto !important;
    border-radius: 0.375rem !important;
    border: 1px solid #E3E6EF !important;
    box-shadow: 0 8px 24px rgba(23, 26, 43, 0.12) !important;
    font-size: 14px !important;
  }

  [role="combobox"] {
    width: 100%;
    min-height: 40px;
    padding: 8px 12px;
    font-size: 14px;
  }

  select option {
    padding: 8px 12px !important;
    font-size: 14px !important;
  }

  [role="listbox"] [role="option"] {
    width: 100% !important;
    min-height: 40px !important;
    padding: 8px 12px !important;
    border-radius: 0.25rem;
    font-size: 14px !important;
    text-align: left;
  }

  [role="listbox"] [role="option"][aria-selected="true"] {
    background-color: #3B52E0 !important;
    color: #FFFFFF !important;
  }
</style>

</head>
<body class="bg-brand-bg text-brand-text font-sans h-screen w-full flex overflow-hidden antialiased" x-data="app()" @tagihan-open-invoice-detail.window="openInvoiceFromTagihan($event.detail)" x-cloak>

  <!-- ======================= -->
  <!-- 1. HALAMAN LOGIN        -->
  <!-- ======================= -->
  <template x-if="page === 'login'">
    <div class="flex-1 flex flex-col items-center justify-center p-4 sm:p-6 bg-brand-bg min-h-screen">
      <div class="bg-brand-surface p-8 rounded-container shadow-card border border-brand-border w-full max-w-sm transition-all">
        <!-- Logo & Title -->
        <div class="flex flex-col items-center mb-6">
          <div class="w-12 h-12 bg-brand-primary-tint rounded-action flex items-center justify-center mb-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-brand-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
            </svg>
          </div>
          <h2 class="text-2xl font-bold text-brand-text tracking-tight text-center">Kromafi Apotek</h2>
          <p class="text-xs text-brand-secondary mt-1 text-center">Point of Sale & Clinical Inventory System</p>
        </div>

        <form @submit.prevent="login()" class="space-y-4">
          <div>
            <label class="block text-[13px] font-semibold text-brand-text mb-1.5">Username</label>
            <input type="text" 
                   x-model="loginUsername"
                   class="w-full h-11 px-3.5 bg-brand-surface border border-brand-border rounded-std text-sm text-brand-text placeholder-brand-muted focus-ring transition" 
                   placeholder="Masukkan username" 
                   required>
          </div>
          
          <div>
            <label class="block text-[13px] font-semibold text-brand-text mb-1.5">Password</label>
            <div class="relative">
              <input :type="showPassword ? 'text' : 'password'" 
                     class="w-full h-11 px-3.5 bg-brand-surface border border-brand-border rounded-std text-sm text-brand-text placeholder-brand-muted focus-ring transition pr-10" 
                     placeholder="Masukkan password" 
                     required>
              <button type="button" @click="showPassword = !showPassword" :aria-label="showPassword ? 'Sembunyikan password' : 'Tampilkan password'" :aria-pressed="showPassword" :class="showPassword ? 'text-brand-primary' : 'text-brand-muted hover:text-brand-secondary'" class="absolute inset-y-0 right-0 px-3 flex items-center transition">
                <svg x-show="!showPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                  <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                  <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />
                </svg>
                <svg x-show="showPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                  <path d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.478z" />
                  <path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.065 7 9.542 7 .847 0 1.669-.105 2.454-.303z" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Primary CTA per DESIGN.md: #FF6A3D -->
          <button type="submit" 
                  class="w-full h-11 bg-brand-accent hover:bg-[#E85A2E] active:scale-[0.98] text-white font-semibold text-sm rounded-action shadow-card transition-all duration-150 flex items-center justify-center mt-2">
            Login
          </button>
        </form>
      </div>
      <p class="mt-6 text-xs text-brand-secondary font-medium">&copy; 2026 Kromafi Apotek. All rights reserved.</p>
    </div>
  </template>

  <!-- ======================= -->
  <!-- 2. MAIN APP LAYOUT      -->
  <!-- ======================= -->
  <template x-if="page !== 'login'">
    <div class="flex-1 flex h-full relative overflow-hidden bg-brand-bg">
      
      <!-- Drawer Overlay (Mobile) -->
      <div x-show="isDrawerOpen" 
           x-transition.opacity.duration.200ms
           @click="isDrawerOpen = false" 
           class="fixed inset-0 bg-[#171A2B]/40 backdrop-blur-xs z-20 lg:hidden">
      </div>

      <!-- Drawer Sidebar (Persistent 240px on Desktop) -->
      <div :class="isDrawerOpen ? 'translate-x-0' : '-translate-x-full'" 
           class="fixed lg:static inset-y-0 left-0 w-[240px] bg-brand-surface border-r border-brand-border z-30 transform transition-transform duration-300 lg:translate-x-0 flex flex-col h-full shadow-modal lg:shadow-none shrink-0">
        
        <!-- Drawer Header -->
        <div class="h-16 px-5 border-b border-brand-border flex justify-between items-center bg-brand-surface shrink-0">
          <div class="flex items-center gap-3">
            <div class="bg-brand-primary-tint p-2 rounded-std">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-brand-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
              </svg>
            </div>
            <div>
              <h1 class="font-bold text-sm tracking-tight text-brand-text leading-snug" x-text="pharmacyName || 'Kromafi Apotek'"></h1>
              <p class="text-[11px] text-brand-secondary font-medium">System POS & Stok</p>
            </div>
          </div>
          <button @click="isDrawerOpen = false" class="lg:hidden text-brand-secondary hover:text-brand-text p-1 rounded-std">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <!-- Drawer Navigation List -->
        <div class="flex-1 overflow-y-auto py-3 px-3 custom-scrollbar">
          <nav class="space-y-1">
            <template x-for="item in ['Penjualan', 'Faktur orderan', 'Tagihan', 'Barang', 'Jasa', 'Kartu stok', 'Barang minus', 'Stok opname', 'Expired', 'Forecast', 'Pareto', 'Laporan', 'Distributor', 'Dokter', 'Metode pembayaran', 'Lemari', 'Petugas', 'Profil apotek']">
              <a href="#" 
                 @click.prevent="page = item.toLowerCase(); isDrawerOpen = false"
                 :class="page.toLowerCase() === item.toLowerCase() 
                    ? 'bg-brand-primary-tint text-brand-primary font-bold border-l-[3.5px] border-brand-primary rounded-r-std rounded-l-none' 
                    : 'text-brand-secondary hover:bg-brand-bg hover:text-brand-text font-medium border-l-[3.5px] border-transparent rounded-std'"
                 class="flex items-center px-3.5 py-2.5 text-xs transition-colors">
                <span x-text="item"></span>
              </a>
            </template>
          </nav>
        </div>

        <!-- Drawer Footer (Logout) -->
        <div class="p-3 border-t border-brand-border bg-brand-bg shrink-0">
          <button @click="logout()" 
                  class="w-full flex items-center justify-center gap-2 text-brand-error font-semibold text-xs hover:bg-red-50 py-2.5 rounded-std transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
            Logout
          </button>
        </div>
      </div>

      <!-- Main Content Area -->
      <div class="flex-1 flex flex-col h-full overflow-hidden w-full min-w-0">
        
        <!-- Header (64px) -->
        <header @update-header.window="headerTitle = $event.detail.title; headerMode = $event.detail.mode" 
                class="h-16 bg-brand-surface border-b border-brand-border flex items-center gap-2 px-3 sm:px-4 shadow-card z-10 shrink-0">
          <div class="flex flex-1 min-w-0 items-center gap-2">
            <button @click="isDrawerOpen = true" class="lg:hidden flex-shrink-0 whitespace-nowrap p-2 text-brand-secondary hover:bg-brand-bg rounded-std focus-ring transition">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
              </svg>
            </button>
            
            <!-- Tombol Kembali jika di Detail / Form -->
            <!-- Tombol Kembali (tidak diperlukan, detail sekarang pakai modal) -->

            <h2 class="flex-1 min-w-0 text-lg sm:text-xl font-bold truncate text-brand-text capitalize" x-text="page"></h2>

            <!-- Signed-in account, sync queue badge, and sync action -->
            <div class="flex shrink-0 items-center gap-1.5 sm:gap-2">
              <span x-show="syncQueueCount > 0" x-transition class="inline-flex items-center gap-1 rounded-full bg-brand-primary-tint px-2 py-1 text-[11px] font-bold text-brand-primary" :title="syncQueueCount + ' transaksi menunggu dikirim ke pusat'" :aria-label="syncQueueCount + ' transaksi menunggu dikirim ke pusat'">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 2m6-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                <span x-text="syncQueueCount"></span>
              </span>
              <button type="button" @click="syncNow()" class="inline-flex h-10 items-center gap-1.5 rounded-action border border-brand-border bg-brand-surface px-3 text-xs font-bold text-brand-primary transition hover:bg-brand-primary-tint" title="Kirim data ke pusat" aria-label="Kirim data ke pusat">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 0 0 4.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 0 1-15.357-2m15.357 2H15" /></svg>
                <span class="hidden sm:inline">Sync</span>
              </button>
              <div class="hidden max-w-[9rem] flex-col items-end pl-1 leading-tight sm:flex">
                <span class="w-full truncate text-xs font-bold text-brand-text" x-text="activeStaffName"></span>
                <span class="w-full truncate text-[10px] font-medium text-brand-secondary" x-text="activeStaffRole"></span>
              </div>
            </div>
          </div>
          
          <!-- Context Action Button -->
          <template x-if="page === 'petugas'">
            <div x-data>
              <button @click="$dispatch('open-petugas-form')" 
                      class="h-10 bg-brand-accent hover:bg-[#E85A2E] active:scale-[0.98] text-white rounded-action px-4 flex items-center gap-2 font-semibold text-xs sm:text-sm shadow-card transition-all flex-shrink-0 whitespace-nowrap">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                </svg>
                <span class="hidden sm:inline">Tambah Petugas</span>
              </button>
            </div>
          </template>
          <template x-if="page === 'lemari'">
            <div x-data>
              <button @click="$dispatch('open-lemari-form')" 
                      class="h-10 bg-brand-accent hover:bg-[#E85A2E] active:scale-[0.98] text-white rounded-action px-4 flex items-center gap-2 font-semibold text-xs sm:text-sm shadow-card transition-all flex-shrink-0 whitespace-nowrap">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                </svg>
                <span class="hidden sm:inline">tambah</span>
              </button>
            </div>
          </template>

          <template x-if="page === 'metode pembayaran'">
            <div x-data>
              <button @click="$dispatch('open-metode-pembayaran-form')" 
                      class="h-10 bg-brand-accent hover:bg-[#E85A2E] active:scale-[0.98] text-white rounded-action px-4 flex items-center gap-2 font-semibold text-xs sm:text-sm shadow-card transition-all flex-shrink-0 whitespace-nowrap">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                </svg>
                <span class="hidden sm:inline">tambah</span>
              </button>
            </div>
          </template>

          <template x-if="page === 'dokter'">
            <div x-data>
              <button @click="$dispatch('open-dokter-form')" 
                      class="h-10 bg-brand-accent hover:bg-[#E85A2E] active:scale-[0.98] text-white rounded-action px-4 flex items-center gap-2 font-semibold text-xs sm:text-sm shadow-card transition-all flex-shrink-0 whitespace-nowrap">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                </svg>
                <span class="hidden sm:inline">tambah</span>
              </button>
            </div>
          </template>

          <template x-if="page === 'distributor'">
            <div x-data>
              <button @click="$dispatch('open-distributor-form')"
                      class="h-10 bg-brand-accent hover:bg-[#E85A2E] active:scale-[0.98] text-white rounded-action px-4 flex items-center gap-2 font-semibold text-xs sm:text-sm shadow-card transition-all flex-shrink-0 whitespace-nowrap">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                </svg>
                <span class="hidden sm:inline">tambah</span>
              </button>
            </div>
          </template>

          <template x-if="page === 'faktur orderan'">
            <button @click="$dispatch('open-faktur-form')" class="h-10 bg-brand-accent hover:bg-[#E85A2E] active:scale-[0.98] text-white rounded-action px-4 flex items-center gap-2 font-semibold text-xs sm:text-sm shadow-card transition-all flex-shrink-0 whitespace-nowrap">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" /></svg>
              <span class="hidden sm:inline">tambah</span>
            </button>
          </template>

          <template x-if="page === 'penjualan'">
            <button @click="$dispatch('open-penjualan-form')" class="h-10 bg-brand-accent hover:bg-[#E85A2E] active:scale-[0.98] text-white rounded-action px-4 flex items-center gap-2 font-semibold text-xs sm:text-sm shadow-card transition-all flex-shrink-0 whitespace-nowrap" title="Tambah penjualan" aria-label="Tambah penjualan">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" /></svg>
              <span class="hidden sm:inline">tambah</span>
            </button>
          </template>
          <template x-if="page === 'laporan'">
            <button @click="$dispatch('open-laporan-form')" class="h-10 bg-brand-accent hover:bg-[#E85A2E] active:scale-[0.98] text-white rounded-action px-4 flex items-center gap-2 font-semibold text-xs sm:text-sm shadow-card transition-all flex-shrink-0 whitespace-nowrap" title="Buat laporan" aria-label="Buat laporan">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" /></svg>
              <span class="hidden sm:inline">Buat laporan</span>
            </button>
          </template>

          <template x-if="page === 'jasa'">
            <div class="flex items-center gap-2">
              <button type="button" @click="$dispatch('toggle-jasa-search')" title="Cari jasa" aria-label="Cari jasa" class="h-10 w-10 inline-flex flex-shrink-0 whitespace-nowrap items-center justify-center border border-brand-border bg-brand-surface text-brand-secondary hover:bg-brand-bg rounded-std transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <circle cx="11" cy="11" r="7" stroke-width="2" />
                  <path stroke-linecap="round" stroke-width="2" d="m20 20-4-4" />
                </svg>
              </button>

              <div x-show="isFormOpen" x-transition.opacity @click.self="closeForm()" @keydown.escape.window.stop.prevent="closeForm()" class="fixed inset-0 z-[70] flex items-center justify-center bg-gray-900/60 p-3 backdrop-blur-sm sm:p-4">
                <section role="dialog" aria-modal="true" aria-labelledby="report-form-title" class="max-h-[calc(100dvh_-_1.5rem)] w-full max-w-md overflow-y-auto rounded-container border border-brand-border bg-brand-surface shadow-modal">
                  <div class="flex items-center justify-between border-b border-brand-border bg-brand-bg p-4">
                    <h3 id="report-form-title" class="text-sm font-bold text-brand-text">Buat laporan</h3>
                    <button type="button" @click="closeForm()" aria-label="Tutup formulir" class="inline-flex h-9 w-9 items-center justify-center rounded-std text-brand-secondary hover:bg-brand-surface">×</button>
                  </div>
                  <form @submit.prevent="processReport()" class="space-y-4 p-4 sm:p-5">
                    <label class="block text-xs font-semibold text-brand-text">Dari tanggal <span class="text-brand-error">*</span>
                      <div x-data="compactDatePicker(true)" x-modelable="value" x-model="formData.from" @date-picker-change="reportError = ''" class="mt-1"></div>
                    </label>
                    <label class="block text-xs font-semibold text-brand-text">Sampai tanggal <span class="text-brand-error">*</span>
                      <div x-data="compactDatePicker(true)" x-modelable="value" x-model="formData.to" @date-picker-change="reportError = ''" class="mt-1"></div>
                    </label>
                    <p x-show="reportError" class="text-xs text-brand-error" x-text="reportError"></p>
                    <div class="flex justify-end gap-2 border-t border-brand-border pt-3">
                      <button type="button" @click="closeForm()" :disabled="isProcessing" class="h-10 rounded-action border border-brand-border px-4 text-xs font-semibold text-brand-secondary disabled:opacity-50">Batal</button>
                      <button type="submit" :disabled="isProcessing" class="inline-flex h-10 items-center gap-2 rounded-action bg-brand-accent px-5 text-xs font-bold text-white hover:bg-[#E85A2E] disabled:cursor-wait disabled:opacity-60">
                        <svg x-show="isProcessing" class="h-4 w-4 animate-spin" fill="none" viewBox="0 0 24 24" aria-hidden="true"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
                        <span x-text="isProcessing ? 'Memproses...' : 'Proses'"></span>
                      </button>
                    </div>
                  </form>
                </section>
              </div>
              <div x-show="isDeleteConfirmOpen" x-transition.opacity @click.self="cancelDeleteReport()" @keydown.escape.window.stop.prevent="cancelDeleteReport()" class="fixed inset-0 z-[80] flex items-center justify-center bg-gray-900/60 p-3 backdrop-blur-sm">
                <section role="alertdialog" aria-modal="true" aria-labelledby="report-delete-title" aria-describedby="report-delete-message" class="max-h-[calc(100dvh_-_1.5rem)] w-full max-w-xs overflow-y-auto rounded-container border border-brand-border bg-brand-surface shadow-modal">
                  <div class="border-b border-brand-border bg-brand-bg px-4 py-3"><h3 id="report-delete-title" class="text-sm font-bold text-brand-text">Hapus draft laporan?</h3></div>
                  <p id="report-delete-message" class="px-4 py-4 text-sm leading-5 text-brand-text">File laporan yang sudah diproses akan dihapus dari penyimpanan lokal. Setelah itu Anda dapat membuat laporan baru.</p>
                  <div class="flex justify-end gap-2 border-t border-brand-border bg-brand-bg px-3 py-3">
                    <button type="button" @click="cancelDeleteReport()" class="h-10 rounded-action border border-brand-border bg-brand-surface px-4 text-sm font-semibold text-brand-secondary">Batal</button>
                    <button type="button" @click="deleteReport()" class="h-10 rounded-action bg-brand-error px-4 text-sm font-bold text-white">Hapus</button>
                  </div>
                </section>
              </div>
            </div>
          </template>

          <template x-if="page !== 'petugas' && page !== 'profil apotek' && page !== 'lemari' && page !== 'metode pembayaran' && page !== 'dokter' && page !== 'distributor' && page !== 'jasa' && page !== 'barang' && page !== 'tagihan' && page !== 'faktur orderan' && page !== 'penjualan' && page !== 'kartu stok' && page !== 'expired' && page !== 'barang minus' && page !== 'stok opname' && page !== 'pareto' && page !== 'forecast' && page !== 'laporan'">
              <div class="w-16 h-16 bg-brand-surface rounded-container border border-brand-border flex items-center justify-center shadow-card">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-brand-secondary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                </svg>
              </div>
              <div class="text-center max-w-sm">
                <p class="text-base font-bold text-brand-text">Halaman <span x-text="page" class="capitalize text-brand-primary"></span></p>
                <p class="text-xs text-brand-secondary mt-1">Konten modul ini dikembangkan mengikuti standar UI/UX <code class="bg-brand-primary-tint text-brand-primary px-1.5 py-0.5 rounded-micro font-mono">DESIGN.md</code>.</p>
              </div>
            </div>
          </template>

        </main>
      </div>
    </div>
  </template>

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script>
  document.addEventListener('alpine:init', () => {
    // Sync outbox: every document saved on this device waits here until a central server exists.
    const SYNC_QUEUE_KEY = 'kromafi.syncQueue';

    const readSyncQueue = () => {
      try {
        const parsed = JSON.parse(localStorage.getItem(SYNC_QUEUE_KEY) || '[]');
        return Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        console.error('Gagal membaca antrean sinkronisasi.', error);
        return [];
      }
    };

    const enqueueSync = (entry) => {
      const queue = readSyncQueue();
      const record = {
        id: `${entry.type}-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
        type: entry.type,
        refId: entry.refId ?? null,
        label: entry.label || '',
        waktu: new Date().toISOString()
      };
      queue.push(record);
      try {
        localStorage.setItem(SYNC_QUEUE_KEY, JSON.stringify(queue));
      } catch (error) {
        console.error('Gagal menyimpan antrean sinkronisasi.', error);
        return null;
      }
      window.dispatchEvent(new CustomEvent('sync-queue-updated'));
      return record;
    };

    const DEFAULT_STAFF_LIST = [
      { id: 1, nama: 'Bimo', role: 'Admin', username: 'bimo', status: 'Aktif' },
      { id: 2, nama: 'Mawar', role: 'User', username: 'mawar', status: 'Aktif' },
      { id: 3, nama: 'Joko', role: 'User', username: 'joko', status: 'Tidak aktif' }
    ];

    const defaultDistributorList = [
      { id: 1, nama: 'BSP', status: 'Aktif' },
      { id: 2, nama: 'Enseval', status: 'Aktif' },
      { id: 3, nama: 'MPI', status: 'Tidak aktif' }
    ];
    const readDistributorList = () => {
      const stored = localStorage.getItem('kromafi.distributors');
      if (stored === null) return defaultDistributorList.map(item => ({ ...item }));
      const parsed = JSON.parse(stored);
      if (!Array.isArray(parsed)) throw new Error('Data distributor harus berupa daftar.');
      return parsed;
    };

    Alpine.data('compactDatePicker', (isRequired = false) => ({
      value: '',
      required: isRequired,
      disabled: false,
      minDate: '',
      maxDate: '',
      month: '',
      open: false,
      panelStyle: {},

      init() {
        const template = document.getElementById('compact-date-picker-template');
        if (template) {
          const fragment = template.content.cloneNode(true);
          const nodes = [...fragment.children];
          this.$root.append(fragment);
          nodes.forEach(node => Alpine.initTree(node));
        }
        this.handleViewportChange = () => { if (this.open) this.positionPanel(); };
        window.addEventListener('resize', this.handleViewportChange);
        window.addEventListener('scroll', this.handleViewportChange, true);
      },

      destroy() {
        window.removeEventListener('resize', this.handleViewportChange);
        window.removeEventListener('scroll', this.handleViewportChange, true);
      },

      get displayValue() {
        if (!this.value) return '';
        const [year, month, day] = this.value.split('-');
        return `${day}/${month}/${year}`;
      },

      get monthLabel() {
        const [year, month] = (this.month || this.today().slice(0, 7)).split('-').map(Number);
        return new Intl.DateTimeFormat('id-ID', { month: 'long', year: 'numeric' }).format(new Date(year, month - 1, 1));
      },

      get calendarDays() {
        const [year, month] = (this.month || this.today().slice(0, 7)).split('-').map(Number);
        const firstDay = new Date(year, month - 1, 1).getDay();
        return Array.from({ length: 42 }, (_, index) => {
          const date = new Date(year, month - 1, index - firstDay + 1);
          const iso = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
          return {
            iso,
            day: date.getDate(),
            inMonth: date.getMonth() === month - 1,
            selected: iso === this.value,
            today: iso === this.today(),
            disabled: (!!this.minDate && iso < this.minDate) || (!!this.maxDate && iso > this.maxDate)
          };
        });
      },

      today() {
        const date = new Date();
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
      },

      setBounds(minDate, maxDate) {
        this.minDate = minDate || '';
        this.maxDate = maxDate || '';
        if (this.open) this.$nextTick(() => this.positionPanel());
      },

      toggle() {
        this.open = !this.open;
        if (this.open) {
          this.month = (this.value || this.today()).slice(0, 7);
          this.$nextTick(() => this.positionPanel());
        }
      },

      close() {
        this.open = false;
      },

      moveMonth(offset) {
        const [year, month] = this.month.split('-').map(Number);
        const date = new Date(year, month - 1 + offset, 1);
        this.month = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
        this.$nextTick(() => this.positionPanel());
      },

      chooseDate(value) {
        if ((this.minDate && value < this.minDate) || (this.maxDate && value > this.maxDate)) return;
        this.value = value;
        this.close();
        this.$dispatch('date-picker-change', { value });
      },

      clearDate() {
        this.value = '';
        this.close();
        this.$dispatch('date-picker-change', { value: '' });
      },

      chooseToday() {
        const today = this.today();
        if ((!this.minDate || today >= this.minDate) && (!this.maxDate || today <= this.maxDate)) this.chooseDate(today);
      },

      positionPanel() {
        const panel = this.$root.querySelector('[data-date-picker-panel]');
        if (!panel || !this.open) return;
        const anchor = this.$root.getBoundingClientRect();
        const width = Math.min(296, window.innerWidth - 16);
        const height = Math.min(panel.scrollHeight, 320);
        const left = Math.max(8, Math.min(anchor.left, window.innerWidth - width - 8));
        const below = anchor.bottom + height + 4 <= window.innerHeight;
        const top = below ? anchor.bottom + 4 : Math.max(8, anchor.top - height - 4);
        this.panelStyle = { left: `${left}px`, top: `${top}px`, width: `${width}px` };
      }
    }));

    Alpine.data('monthYearPicker', (isRequired = false) => ({
      value: '',
      required: isRequired,
      open: false,
      viewYear: 0,
      panelStyle: {},

      init() {
        const template = document.getElementById('month-year-picker-template');
        if (template) {
          const fragment = template.content.cloneNode(true);
          const nodes = [...fragment.children];
          this.$root.append(fragment);
          nodes.forEach(node => Alpine.initTree(node));
        }
        if (!this.value) this.value = this.currentMonthValue();
        this.viewYear = Number(this.value.slice(0, 4)) || this.currentYear();
        this.handleViewportChange = () => { if (this.open) this.positionPanel(); };
        window.addEventListener('resize', this.handleViewportChange);
        window.addEventListener('scroll', this.handleViewportChange, true);
      },

      destroy() {
        window.removeEventListener('resize', this.handleViewportChange);
        window.removeEventListener('scroll', this.handleViewportChange, true);
      },

      currentYear() {
        return new Date().getFullYear();
      },

      currentMonthValue() {
        const date = new Date();
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
      },

      get displayValue() {
        if (!this.value) return 'Pilih bulan';
        const [year, month] = this.value.split('-').map(Number);
        if (!year || !month) return 'Pilih bulan';
        return new Intl.DateTimeFormat('id-ID', { month: 'long', year: 'numeric' }).format(new Date(year, month - 1, 1));
      },

      get yearLabel() {
        return String(this.viewYear);
      },

      get monthGrid() {
        const formatter = new Intl.DateTimeFormat('id-ID', { month: 'short' });
        return Array.from({ length: 12 }, (_, index) => {
          const value = `${this.viewYear}-${String(index + 1).padStart(2, '0')}`;
          return {
            value,
            label: formatter.format(new Date(this.viewYear, index, 1)).replace('.', ''),
            selected: value === this.value,
            isCurrent: value === this.currentMonthValue()
          };
        });
      },

      toggle() {
        this.open = !this.open;
        if (this.open) {
          this.viewYear = Number(this.value.slice(0, 4)) || this.currentYear();
          this.$nextTick(() => this.positionPanel());
        }
      },

      close() {
        this.open = false;
      },

      moveYear(offset) {
        this.viewYear += offset;
        this.$nextTick(() => this.positionPanel());
      },

      chooseMonth(month) {
        this.value = month.value;
        this.open = false;
        this.$dispatch('month-picker-change', { value: this.value });
      },

      chooseCurrentMonth() {
        const value = this.currentMonthValue();
        this.viewYear = Number(value.slice(0, 4));
        this.value = value;
        this.open = false;
        this.$dispatch('month-picker-change', { value });
      },

      positionPanel() {
        const panel = this.$root.querySelector('[data-month-picker-panel]');
        if (!panel || !this.open) return;
        const anchor = this.$root.getBoundingClientRect();
        const width = Math.min(300, window.innerWidth - 16);
        const height = Math.min(panel.scrollHeight, 300);
        const left = Math.max(8, Math.min(anchor.left, window.innerWidth - width - 8));
        const below = anchor.bottom + height + 4 <= window.innerHeight;
        const top = below ? anchor.bottom + 4 : Math.max(8, anchor.top - height - 4);
        this.panelStyle = { left: `${left}px`, top: `${top}px`, width: `${width}px` };
      }
    }));

    // Main App Data
    Alpine.data('app', () => ({
      page: 'login',
      isDrawerOpen: false,
      headerTitle: 'Petugas',
      headerMode: 'list',
      pharmacyName: 'Kromafi Apotek',
      loginUsername: '',
      showPassword: false,
      currentUser: '',
      syncQueueCount: 0,
      syncNotice: '',
      syncNoticeTimer: null,

      init() {
        this.currentUser = this.readGasUser() || localStorage.getItem('kromafi.loggedInUser') || '';
        this.loadPharmacy();
        this.refreshSyncQueue();
        window.addEventListener('pharmacy-updated', () => {
          this.loadPharmacy();
        });
        window.addEventListener('sync-queue-updated', () => {
          this.refreshSyncQueue();
        });
      },

      get activeStaff() {
        let list = DEFAULT_STAFF_LIST;
        try {
          const parsed = JSON.parse(localStorage.getItem('kromafi.petugas') || 'null');
          if (Array.isArray(parsed)) list = parsed;
        } catch (error) {
          list = DEFAULT_STAFF_LIST;
        }
        const username = (localStorage.getItem('kromafi.loggedInUser') || '').trim().toLocaleLowerCase('id');
        return list.find(item => String(item.username || '').trim().toLocaleLowerCase('id') === username) || null;
      },

      get activeStaffName() {
        if (this.activeStaff) return this.activeStaff.nama;
        return (localStorage.getItem('kromafi.loggedInUser') || '').trim() || '-';
      },

      get activeStaffRole() {
        return this.activeStaff ? (this.activeStaff.role || '-') : '-';
      },

      refreshSyncQueue() {
        this.syncQueueCount = readSyncQueue().length;
      },

      showSyncNotice(message) {
        this.syncNotice = message;
        window.clearTimeout(this.syncNoticeTimer);
        this.syncNoticeTimer = window.setTimeout(() => { this.syncNotice = ''; }, 4000);
      },

      syncNow() {
        const count = readSyncQueue().length;
        if (!count) {
          this.showSyncNotice('Tidak ada data yang menunggu dikirim.');
          return;
        }
        this.showSyncNotice(`Pusat belum diatur. ${count} transaksi tetap tersimpan di antrean.`);
      },

      loadPharmacy() {
        try {
          const stored = localStorage.getItem('kromafi.pharmacy');
          if (stored) {
            const parsed = JSON.parse(stored);
            if (parsed && parsed.name) {
              this.pharmacyName = parsed.name;
              return;
            }
          }
        } catch(e) {}
        this.pharmacyName = 'Kromafi Apotek';
      },

      login() {
        this.currentUser = this.readGasUser() || this.loginUsername.trim();
        if (this.currentUser) localStorage.setItem('kromafi.loggedInUser', this.currentUser);
        this.showPassword = false;
        this.page = 'petugas';
      },

      readGasUser() {
        const value = document.getElementById('gas-active-user')?.textContent.trim() || '';
        return value.includes('<?') ? '' : value;
      },

      openInvoiceFromTagihan(invoiceId) {
        this.page = 'faktur orderan';
        this.isDrawerOpen = false;
        this.$nextTick(() => {
          window.setTimeout(() => {
            window.dispatchEvent(new CustomEvent('open-invoice-detail-from-tagihan', { detail: invoiceId }));
          }, 0);
        });
      },
      
      logout() {
        this.currentUser = '';
        localStorage.removeItem('kromafi.loggedInUser');
        this.page = 'login';
        this.isDrawerOpen = false;
        this.showPassword = false;
      }
    }));

    // Profil Apotek Page Data
    Alpine.data('profilApotekPage', () => ({
      formData: {
        name: 'Kromafi Apotek',
        address: ''
      },
      errors: {},
      isLoading: false,
      toastMessage: null,

      init() {
        this.loadStore();
      },

      loadStore() {
        try {
          const stored = localStorage.getItem('kromafi.pharmacy');
          if (stored) {
            const parsed = JSON.parse(stored);
            this.formData = {
              name: parsed.name || 'Kromafi Apotek',
              address: parsed.address || ''
            };
            return;
          }
        } catch(e) {}
        this.formData = { name: 'Kromafi Apotek', address: '' };
      },

      validate() {
        this.errors = {};
        if (!this.formData.name.trim()) {
          this.errors.name = 'Nama apotek wajib diisi';
        }
        return Object.keys(this.errors).length === 0;
      },

      save() {
        if (!this.validate()) return;
        this.isLoading = true;
        setTimeout(() => {
          const dataToSave = {
            name: this.formData.name.trim(),
            address: this.formData.address.trim()
          };
          localStorage.setItem('kromafi.pharmacy', JSON.stringify(dataToSave));
          window.dispatchEvent(new CustomEvent('pharmacy-updated'));
          this.isLoading = false;
          this.toastMessage = 'Profil apotek tersimpan';
          setTimeout(() => { this.toastMessage = null; }, 3000);
        }, 400);
      },

      reset() {
        this.loadStore();
        this.errors = {};
      }
    }));

    // Petugas Page Data
    Alpine.data('petugasPage', () => ({
      filter: 'semua', // 'semua', 'aktif', 'tidak aktif'
      visibleCount: 10,
      isDetailOpen: false,
      isFormOpen: false,
      selectedPetugas: null,
      formData: {
        id: null,
        nama: '',
        role: 'Admin',
        username: '',
        password: '',
        status: 'Aktif'
      },
      petugasList: [
        { id: 1, nama: 'Bimo', role: 'Admin', username: 'bimo', password: 'bimo1', status: 'Aktif' },
        { id: 2, nama: 'Mawar', role: 'User', username: 'mawar', password: 'mawar2', status: 'Aktif' },
        { id: 3, nama: 'Joko', role: 'User', username: 'joko', password: 'joko3', status: 'Tidak aktif' },
      ],

      init() {
        try {
          const stored = localStorage.getItem('kromafi.petugas');
          if (stored) {
            const parsed = JSON.parse(stored);
            if (Array.isArray(parsed)) this.petugasList = parsed;
          }
        } catch (e) {}
      },

      get filteredPetugas() {
        let list = this.petugasList;
        if (this.filter === 'aktif') list = list.filter(p => p.status === 'Aktif');
        if (this.filter === 'tidak aktif') list = list.filter(p => p.status === 'Tidak aktif');
        return [...list].sort((a, b) => a.nama.localeCompare(b.nama, 'id', { sensitivity: 'base' }));
      },

      get visiblePetugas() {
        return this.filteredPetugas.slice(0, this.visibleCount);
      },

      get hasMore() {
        return this.filteredPetugas.length > this.visibleCount;
      },

      loadMore() {
        this.visibleCount += 10;
      },

      openDetail(petugas) {
        this.selectedPetugas = { ...petugas };
        this.isDetailOpen = true;
      },

      closeDetail() {
        this.isDetailOpen = false;
      },

      openForm(petugas = null) {
        if (petugas) {
          this.formData = { ...petugas };
        } else {
          this.formData = { id: null, nama: '', role: 'Admin', username: '', password: '', status: 'Aktif' };
        }
        this.isDetailOpen = false;
        this.isFormOpen = true;
      },

      closeForm() {
        this.isFormOpen = false;
      },

      saveList() {
        try {
          localStorage.setItem('kromafi.petugas', JSON.stringify(this.petugasList));
        } catch (e) {}
      },

      savePetugas() {
        if (!this.formData.nama.trim()) return;
        this.formData.nama = this.formData.nama.trim();
        if (this.formData.id) {
          const idx = this.petugasList.findIndex(p => p.id === this.formData.id);
          if (idx !== -1) {
            this.petugasList[idx] = { ...this.formData };
            this.selectedPetugas = { ...this.formData };
          }
        } else {
          const newId = Date.now();
          const newItem = { ...this.formData, id: newId };
          this.petugasList.unshift(newItem);
          this.selectedPetugas = newItem;
        }
        this.saveList();
        this.isFormOpen = false;
        this.isDetailOpen = true;
      }
    }));

    // Lemari Page Data
    Alpine.data('lemariPage', () => ({
      filter: 'semua', // 'semua', 'aktif', 'tidak aktif'
      visibleCount: 10,
      isDetailOpen: false,
      isFormOpen: false,
      selectedLemari: null,
      formData: {
        id: null,
        nama: '',
        status: 'Aktif'
      },
      lemariList: [

    Alpine.data('stokOpnamePage', () => ({
      products: [],
      stocktakes: [],
      selectedProduct: null,
      stokRiil: '',
      visibleCount: 10,
      loadError: '',
      formError: '',
      toastMessage: '',

      init() {
        try {
          this.products = this.readList('kromafi.barang');
          this.stocktakes = this.readList('kromafi.stokOpname');
        } catch (error) {
          console.error('Gagal memuat data Stok Opname.', error);
          this.loadError = 'Data stok opname tidak dapat dimuat.';
        }
      },

      readList(key) {
        const stored = localStorage.getItem(key);
        if (stored === null) return [];
        const parsed = JSON.parse(stored);
        if (!Array.isArray(parsed)) throw new Error(`${key} harus berupa daftar.`);
        return parsed;
      },

      productId(product) {
        return product.id_barang ?? product.idBarang ?? product.id;
      },

      productName(product) {
        return String(product.nama_barang ?? product.namaBarang ?? product.nama ?? '');
      },

      productUnit(product) {
        return product.satuan ?? product.unit ?? 'Unit';
      },

      productStock(product) {
        return this.parseAngka(product.stok ?? product.stok_akhir);
      },

      currentPeriod() {
        return this.today().slice(0, 7).replace('-', '');
      },

      isActiveProduct(product) {
        return String(product.status ?? product.status_barang ?? '').trim().toLocaleLowerCase('id') === 'aktif';
      },

      get activeProducts() {
        return this.products
          .filter(product => product && this.isActiveProduct(product) && this.productId(product) !== undefined && this.productId(product) !== null && this.productId(product) !== '' && this.productName(product));
      },

      get sortedProducts() {
        const period = this.currentPeriod();
        return this.activeProducts
          .filter(product => String(product.bulan_stok_opname || '') !== period)
          .sort((a, b) => this.productName(a).localeCompare(this.productName(b), 'id', { sensitivity: 'base' }));
      },

      get visibleProducts() {
        return this.sortedProducts.slice(0, this.visibleCount);
      },

      get hasMore() {
        return this.sortedProducts.length > this.visibleCount;
      },

      get difference() {
        if (!this.selectedProduct) return null;
        const realStock = this.parseAngka(this.stokRiil);
        const appStock = this.productStock(this.selectedProduct);
        return realStock === null || appStock === null ? null : realStock - appStock;
      },

      parseAngka(value) {
        if (typeof value === 'number') return Number.isFinite(value) ? value : null;
        const raw = String(value ?? '').trim();
        if (!raw) return null;
        const normalized = raw.replace(/[^\d,.-]/g, '').replace(/,/g, '.');
        const number = Number(normalized);
        return Number.isFinite(number) ? number : null;
      },

      formatRibuan(value) {
        const number = this.parseAngka(value);
        return number === null ? '-' : new Intl.NumberFormat('id-ID', { maximumFractionDigits: 2 }).format(number);
      },

      loadMore() {
        this.visibleCount += 10;
      },

      openDetail(product) {
        const stock = this.productStock(product);
        if (stock === null) {
          this.showToast('Stok aplikasi barang tidak valid.');
          return;
        }
        this.selectedProduct = product;
        this.stokRiil = String(stock);
        this.formError = '';
      },

      closeDetail() {
        this.selectedProduct = null;
        this.stokRiil = '';
        this.formError = '';
      },

      today() {
        const date = new Date();
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
      },

      activeStaffName() {
        let username = '';
        try {
          username = (localStorage.getItem('kromafi.loggedInUser') || '').trim();
          const staff = this.readList('kromafi.petugas').find(item => String(item.username || '').trim().toLocaleLowerCase('id') === username.toLocaleLowerCase('id'));
          return staff ? staff.nama : (username || '-');
        } catch (error) {
          console.error('Gagal membaca petugas aktif untuk Stok Opname.', error);
          return username || '-';
        }
      },

      saveOpname() {
        this.formError = '';
        const realStock = this.parseAngka(this.stokRiil);
        if (!this.selectedProduct || realStock === null || realStock < 0) {
          this.formError = 'Masukkan stok riil berupa angka nol atau lebih.';
          return;
        }

        let latestProducts;
        let latestStocktakes;
        try {
          latestProducts = this.readList('kromafi.barang');
          latestStocktakes = this.readList('kromafi.stokOpname');
        } catch (error) {
          console.error('Gagal membaca data terbaru Stok Opname.', error);
          this.formError = 'Data stok tidak dapat dibaca. Perubahan belum disimpan.';
          return;
        }

        const productId = this.productId(this.selectedProduct);
        const productIndex = latestProducts.findIndex(item => String(this.productId(item)) === String(productId));
        if (productIndex < 0) {
          this.formError = 'Barang tidak ditemukan. Muat ulang halaman sebelum mencoba lagi.';
          return;
        }
        const period = this.currentPeriod();
        if (!this.isActiveProduct(latestProducts[productIndex])) {
          this.formError = 'Barang tidak aktif dan tidak dapat di-opname.';
          return;
        }
        if (String(latestProducts[productIndex].bulan_stok_opname || '') === period) {
          this.formError = 'Barang sudah di-opname bulan ini.';
          return;
        }
        const currentStock = this.productStock(latestProducts[productIndex]);
        const displayedStock = this.productStock(this.selectedProduct);
        if (currentStock === null) {
          this.formError = 'Stok aplikasi terbaru tidak valid.';
          return;
        }
        if (currentStock !== displayedStock) {
          this.formError = 'Stok aplikasi berubah. Kembali ke daftar lalu buka barang kembali.';
          return;
        }

        const difference = realStock - currentStock;
        const date = this.today();
        const entry = {
          id: `OPN-${date.replace(/-/g, '')}-${String(Date.now()).slice(-6)}`,
          productId,
          nama: this.productName(this.selectedProduct),
          satuan: this.productUnit(this.selectedProduct),
          stokSistem: currentStock,
          stokFisik: realStock,
          selisih: difference,
          bulan_stok_opname: period,
          kartuStokKategori: 'Stok Opname',
          tanggal: date,
          petugasNama: this.activeStaffName(),
          waktu: new Date().toISOString()
        };
        latestStocktakes.unshift(entry);
        latestProducts[productIndex] = {
          ...latestProducts[productIndex],
          stok: realStock,
          bulan_stok_opname: period
        };

        const keys = ['kromafi.barang', 'kromafi.stokOpname'];
        const previous = {};
        try {
          keys.forEach(key => { previous[key] = localStorage.getItem(key); });
        } catch (error) {
          console.error('Gagal menyiapkan penyimpanan Stok Opname.', error);
          this.formError = 'Data stok tidak dapat disiapkan untuk disimpan.';
          return;
        }
        try {
          localStorage.setItem('kromafi.barang', JSON.stringify(latestProducts));
          localStorage.setItem('kromafi.stokOpname', JSON.stringify(latestStocktakes));
        } catch (error) {
          keys.forEach(key => {
            try {
              if (previous[key] === null) localStorage.removeItem(key);
              else localStorage.setItem(key, previous[key]);
            } catch (rollbackError) {
              console.error(`Gagal memulihkan ${key} setelah penyimpanan Stok Opname gagal.`, rollbackError);
            }
          });
          console.error('Gagal menyimpan perubahan Stok Opname.', error);
          this.formError = 'Stok opname gagal disimpan. Stok tidak diubah.';
          return;
        }

        this.products = latestProducts;
        this.stocktakes = latestStocktakes;
        enqueueSync({ type: 'Stok opname', refId: entry.id, label: `Opname ${entry.nama}` });
        this.closeDetail();
        this.showToast('Stok opname tersimpan dan stok aplikasi diperbarui.');
      },

      formError: '',

      },

        { id: 1, nama: 'Suntik', harga: 100000, status: 'Aktif' },

        { id: 3, nama: 'Cek darah', harga: 50000, status: 'Tidak aktif' },
      ],

      init() {
        try {
          const stored = localStorage.getItem('kromafi.jasa');
          if (stored) {
            const parsed = JSON.parse(stored);
            if (Array.isArray(parsed)) this.jasaList = parsed;
          }

      },

      get filteredJasa() {
        let list = this.jasaList;
        if (this.filter === 'aktif') list = list.filter(item => item.status === 'Aktif');
        if (this.filter === 'tidak aktif') list = list.filter(item => item.status === 'Tidak aktif');
        const query = this.searchQuery.trim().toLocaleLowerCase('id');
        if (query) list = list.filter(item => item.nama.toLocaleLowerCase('id').includes(query));

      get hasMore() {

      toggleSearch() {

      saveJasa() {
        this.formError = '';
        const nama = this.formData.nama.trim();
        const harga = Number(this.formData.harga);
        if (!nama || !Number.isFinite(harga) || harga < 0) return;

        const readList = (key) => {
          try {
            const parsed = JSON.parse(localStorage.getItem(key) || '[]');
            return Array.isArray(parsed) ? parsed : [];
          } catch (e) { return []; }
        };

        const currentBarangList = readList('kromafi.barang');
        const currentJasaList = readList('kromafi.jasa');
        const normalizedNama = nama.toLocaleLowerCase('id');
        const editId = this.formData.id;

        const existsInJasa = currentJasaList.some(j => String(j.id) !== String(editId) && String(j.nama || '').trim().toLocaleLowerCase('id') === normalizedNama);
        const existsInBarang = currentBarangList.some(b => String(b.nama || '').trim().toLocaleLowerCase('id') === normalizedNama);

        if (existsInBarang || existsInJasa) {
          this.formError = 'Nama sudah dipakai';

        this.formData.nama = nama;
        this.formData.harga = harga;

      filterMetode: 'semua',

      lineFormError: '',
      formData: { items: [] },
      lineForm: { jenis: 'barang', productId: '', jasaId: '', nama: '', jumlah: '', hargaJual: 0, diskonTagihan: '', batch: '' },

      init() {

          { id: 3, nama: 'Cetirizin', hargaModal: 300, hargaJual: 400, satuan: 'Tablet', status: 'Aktif' }
        ]);
        this.jasaList = readList('kromafi.jasa', [
          { id: 1, nama: 'Suntik', harga: 100000, status: 'Aktif' },

          { id: 3, nama: 'Cek darah', harga: 50000, status: 'Tidak aktif' }

        this.paymentList = readList('kromafi.metode-pembayaran', [

      get paymentOptions() {

          if (p && p.status !== 'Tidak aktif' && p.nama) {
            items.push({

      itemStockInfo(item) {

      get activeStaff() {

        return this.staffList.find(item => (item.username || '').trim().toLocaleLowerCase('id') === username) || null;
      },

      get activeStaffName() {
        return this.activeStaff ? this.activeStaff.nama : (localStorage.getItem('kromafi.loggedInUser') || '');

      get isAdmin() {

      get filteredSales() {
        return this.sales.filter(sale => sale.tanggal === this.filterTanggal && (this.filterMetode === 'semua' || sale.metodePembayaran === this.filterMetode))
          .sort((a, b) => (b.waktu || '').localeCompare(a.waktu || '') || (b.id || '').localeCompare(a.id || ''));
      },

      get visibleSales() {
        return this.filteredSales.slice(0, this.visibleCount);
      },

      get hasMore() {
        return this.filteredSales.length > this.visibleCount;
      },

      get totalOmzet() {
        return this.filteredSales.reduce((sum, sale) => sum + (this.parseAngka(sale.total_tagihan_final) || 0), 0);
      },

      get totalTagihan() {
        return (this.formData.items || []).reduce((sum, line) => {
          const finalAmount = this.parseAngka(line.tagihanFinal);
          return sum + (finalAmount === null ? (this.parseAngka(line.tagihan) || 0) : finalAmount);
        }, 0);

      get totalFinal() {
        return Math.max(0, this.totalTagihan - (this.parseAngka(this.formData.diskonTotal) || 0));

      get kembalian() {

      get lineTotal() {
        return (this.parseAngka(this.lineForm.jumlah) || 0) * (this.parseAngka(this.lineForm.hargaJual) || 0);
      },

      get lineFinal() {
        return Math.max(0, this.lineTotal - (this.parseAngka(this.lineForm.diskonTagihan) || 0));
      },

      formatRibuan(value) {
        if (value === '' || value === null || value === undefined) return '';
        const number = this.parseAngka(value);
        return number === null ? '' : new Intl.NumberFormat('id-ID', { maximumFractionDigits: 0 }).format(number);
      },

      parseAngka(value) {
        if (typeof value === 'number') return Number.isFinite(value) ? value : null;
        const raw = String(value ?? '').trim();
        if (!raw) return null;
        let normalized = raw.replace(/[^\d,.-]/g, '');
        if (normalized.includes(',')) normalized = normalized.replace(/\./g, '').replace(',', '.').replace(/,/g, '');
        else normalized = normalized.replace(/\./g, '');
        const number = Number(normalized);
        return Number.isFinite(number) ? number : null;
      },

      formatMoneyInput(event, field) {
        const input = event.target;
        const digitsBefore = (input.value.slice(0, input.selectionStart || 0).match(/\d/g) || []).length;
        const digits = input.value.replace(/\D/g, '');
        const formatted = digits ? new Intl.NumberFormat('id-ID', { maximumFractionDigits: 0 }).format(Number(digits)) : '';
        const target = ['jumlah', 'diskonTagihan'].includes(field) ? this.lineForm : this.formData;
        target[field] = formatted;
        input.value = formatted;
        let caret = 0;
        let seen = 0;
        while (caret < formatted.length && seen < digitsBefore) {
          if (/\d/.test(formatted[caret])) seen += 1;
          caret += 1;
        }
        input.setSelectionRange(caret, caret);
      },

      formatHarga(value) {
        const formatted = this.formatRibuan(value);
        return `Rp ${formatted || '0'}`;
      },

      formatDate(value) {
        if (!value) return '-';
        const date = new Date(`${value}T00:00:00`);
        return Number.isNaN(date.getTime()) ? '-' : new Intl.DateTimeFormat('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }).format(date);
      },

      formatDateTime(value) {
        if (!value) return '-';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return '-';
        return `${this.formatDate(date.toISOString().slice(0, 10))} ${new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false }).format(date)}`;
      },

      saleSubtotal(sale) {
        return (sale && sale.items ? sale.items : []).reduce((sum, line) => {
          const finalAmount = this.parseAngka(line.tagihanFinal);
          return sum + (finalAmount === null ? (this.parseAngka(line.tagihan) || 0) : finalAmount);
        }, 0);
      },

      saleNames(sale) {
        const names = (sale.items || []).slice(0, 3).map(line => line.nama);
        return names.join(', ') + ((sale.items || []).length > 3 ? ', ...' : '');

      isCash(method) {

      productSalePrice(product) {
        const value = product.harga_jual ?? product.hargaJual ?? product.harga_jual_lama ?? product.hargaJualLama;
        const price = this.parseAngka(value);
        return price === null ? 0 : Math.ceil(price);

      closeDetail() {

      commitSale(updated) {

      lockSale() {

      unlockSale() {

      deleteSale() {

      openDeleteConfirm(message, onConfirm) {

      closeDeleteConfirm() {

      printSale() {
        const sale = this.selectedSale;
        if (!sale || !sale.locked) {
          this.showToast('Struk hanya dapat dicetak setelah nota dikunci.');
          return;
        }

        let pharmacy = { name: 'Kromafi Apotek', address: '' };

          const stored = localStorage.getItem('kromafi.pharmacy');

            const parsed = JSON.parse(stored);

        }

        const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, character => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        })[character]);
        const money = value => this.formatHarga(value);
        const items = Array.isArray(sale.items) ? sale.items : [];
        const itemMarkup = items.map(line => {
          const quantity = this.parseAngka(line.jumlah) || 0;

          const discount = this.parseAngka(line.diskonTagihan) || 0;

        const printTime = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(printedAt);

        const receipt = `<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Struk ${escapeHtml(sale.id)}</title><style>
          *{box-sizing:border-box}body{margin:0;padding:16px;font:12px/1.45 Arial,sans-serif;color:#111}.receipt{width:100%;max-width:320px;margin:0 auto}.center{text-align:center}.pharmacy{font-size:16px;font-weight:700}.address{white-space:pre-wrap;margin-top:3px}.divider{border:0;border-top:1px dashed #555;margin:10px 0}.item{padding:0 0 8px;margin:0 0 8px;border-bottom:1px dashed #aaa}.item-name{font-weight:700;overflow-wrap:anywhere;margin-bottom:3px}.row{display:flex;justify-content:space-between;gap:8px}.row span:first-child{min-width:0}.row span:last-child{white-space:nowrap;text-align:right}.muted{color:#444}.strong{font-weight:700}.summary{padding:0 0 8px}.staff{margin-top:10px}.meta{margin-top:3px}@page{size:80mm auto;margin:4mm}@media print{body{padding:0}.receipt{max-width:none}}
          </style></head><body><main class="receipt">
          <header class="center"><div class="pharmacy">${escapeHtml(pharmacy.name)}</div><div class="address">${escapeHtml(pharmacy.address)}</div></header>
          <hr class="divider">${itemMarkup}
          <div class="summary">
            <div class="row"><span>Total tagihan</span><span>${escapeHtml(money(total))}</span></div>
            <div class="row muted"><span>Diskon total tagihan</span><span>${escapeHtml(money(totalDiscount))}</span></div>
            <div class="row strong"><span>Total tagihan final</span><span>${escapeHtml(money(finalTotal))}</span></div>
          </div>
          <hr class="divider"><footer class="center"><div class="staff">${escapeHtml(sale.namaPetugas || this.activeStaffName || '-')}</div><div class="meta">${printDate} : ${printTime}</div></footer>
          </main><script>window.addEventListener('load',function(){window.focus();window.print();});window.addEventListener('afterprint',function(){window.close();});<\/script></body></html>`;
        popup.document.open();
        popup.document.write(receipt);
        popup.document.close();
      },

      showToast(message) {
        this.toastMessage = message;
        window.setTimeout(() => { this.toastMessage = ''; }, 4000);
      },

      openForm(sale = null) {
        this.loadReferences();
        this.closeDropdown();
        if (sale && sale.locked) return;
        this.formError = '';
        this.selectedSale = null;
        this.formData = sale
          ? { ...JSON.parse(JSON.stringify(sale)), items: sale.items.map(line => ({ ...line, tagihanFinal: this.parseAngka(line.tagihanFinal) ?? (this.parseAngka(line.tagihan) || 0) })), diskonTotal: this.formatRibuan(sale.diskon_total_tagihan), bayar: this.formatRibuan(sale.bayar) }
          : { id: '', items: [], diskonTotal: '', metodePembayaran: '', bayar: '', tanggal: new Date().toISOString().slice(0, 10), namaPasien: '', namaDokter: '', catatan: '', locked: false };
        this.isDetailOpen = false;

      closeForm() {

      removeSaleLine(index) {

      openLineForm(line = null, index = null) {

        this.autocompleteOpen = false;
        this.lineFormIndex = index;
        this.lineForm = line
          ? { ...line, jenis: line.jenis === 'jasa' ? 'jasa' : 'barang', jumlah: this.formatRibuan(line.jumlah), diskonTagihan: this.formatRibuan(line.diskonTagihan) }
          : { jenis: 'barang', productId: '', jasaId: '', nama: '', jumlah: '', hargaJual: 0, diskonTagihan: '', batch: '' };
        this.selectedProduct = this.lineForm.jenis === 'barang' ? this.productList.find(item => String(item.id) === String(this.lineForm.productId)) || null : null;

      selectItem(item) {

          this.lineForm.hargaJual = this.productSalePrice(item.raw);
          this.lineForm.batch = item.raw.batchTerakhir || item.raw.batch_terakhir || item.raw.lastBatch || item.raw.batch || (Array.isArray(item.raw.batches) && item.raw.batches.length ? (item.raw.batches[item.raw.batches.length - 1].batch || '') : '');

      syncSelectedItem() {

          this.selectedService = null;

            this.lineForm.productId = match.id;

            this.selectedService = null;
            this.lineForm.hargaJual = this.productSalePrice(match.raw);
            this.lineForm.batch = match.raw.batchTerakhir || match.raw.batch_terakhir || match.raw.lastBatch || match.raw.batch || (Array.isArray(match.raw.batches) && match.raw.batches.length ? (match.raw.batches[match.raw.batches.length - 1].batch || '') : '');
          } else {
            this.lineForm.jasaId = match.id;
            this.lineForm.productId = '';
            this.selectedService = match.raw;
            this.selectedProduct = null;
            this.lineForm.hargaJual = this.parseAngka(match.raw.harga) || 0;
            this.lineForm.batch = '';
          }
        } else {
          this.selectedProduct = null;
          this.selectedService = null;
          this.lineForm.productId = '';
          this.lineForm.jasaId = '';
          this.lineForm.jenis = 'barang';
          this.lineForm.hargaJual = 0;
          this.lineForm.batch = '';
        }
      },

      closeLineForm() {
        this.isLineFormOpen = false;
        this.autocompleteOpen = false;
        this.selectedProduct = null;
        this.selectedService = null;
        this.lineFormError = '';
      },

      saveLine() {
        const quantity = this.parseAngka(this.lineForm.jumlah) || 0;
        if (quantity <= 0) {
          this.lineFormError = 'Jumlah wajib lebih besar dari nol.';
          return;
        }
        const queryName = (this.lineForm.nama || '').trim().toLocaleLowerCase('id');
        const matchedItem = this.itemOptions.find(item => item.nama.trim().toLocaleLowerCase('id') === queryName || (this.lineForm.jenis === 'jasa' ? String(item.id) === String(this.lineForm.jasaId) : String(item.id) === String(this.lineForm.productId)));
        if (!matchedItem || !this.lineForm.nama.trim()) {
          this.lineFormError = 'Pilih item yang tersedia.';
          return;
        }
        const isService = matchedItem.jenis === 'jasa';
        const selectedItem = matchedItem.raw;
        const price = isService ? (this.parseAngka(selectedItem.harga) || 0) : this.productSalePrice(selectedItem);
        const discount = this.parseAngka(this.lineForm.diskonTagihan) || 0;
        const grossAmount = quantity * price;
        const line = {
          ...this.lineForm,
          id: this.lineForm.id || `${isService ? 'JSA' : 'BAR'}-${Date.now()}`,
          jenis: isService ? 'jasa' : 'barang',
          productId: isService ? '' : selectedItem.id,
          jasaId: isService ? selectedItem.id : '',
          nama: selectedItem.nama,
          jumlah: quantity,
          hargaJual: price,
          diskonTagihan: discount,
          tagihan: grossAmount,
          tagihanFinal: Math.max(0, grossAmount - discount),
          satuan: isService ? 'Layanan' : (selectedItem.satuan || 'Unit'),
          batch: isService ? '' : (this.lineForm.batch || '')
        };
        if (this.lineFormIndex === null) this.formData.items.push(line);
        else this.formData.items.splice(this.lineFormIndex, 1, line);

      openLineDetail(line) {
