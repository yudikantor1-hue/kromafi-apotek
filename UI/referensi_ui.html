      closeLineDetail() {
        this.isLineDetailOpen = false;
      },

      saveSale() {
        this.formError = '';
        if (!this.formData.items.length) { this.formError = 'Tambahkan minimal satu barang.'; return; }
        if (!this.formData.metodePembayaran) { this.formError = 'Pilih metode pembayaran.'; return; }
        if (!this.formData.tanggal) { this.formError = 'Tanggal wajib diisi.'; return; }
        const dateCode = this.formData.tanggal.replace(/-/g, '');
        const sale = {
          ...this.formData,
          id: this.formData.id || `PEN-${dateCode}-${Math.random().toString(36).slice(2, 8).toUpperCase()}`,
          items: this.formData.items.map(line => ({ ...line, jumlah: this.parseAngka(line.jumlah) || 0, hargaJual: this.parseAngka(line.hargaJual) || 0, diskonTagihan: this.parseAngka(line.diskonTagihan) || 0, tagihan: this.parseAngka(line.tagihan) || 0, tagihanFinal: this.parseAngka(line.tagihanFinal) ?? (this.parseAngka(line.tagihan) || 0) })),
          diskon_total_tagihan: this.parseAngka(this.formData.diskonTotal) || 0,
          total_tagihan: this.totalTagihan,
          total_tagihan_final: this.totalFinal,
          bayar: this.parseAngka(this.formData.bayar) || 0,
          namaPetugas: this.activeStaffName,
          waktu: this.formData.waktu || new Date().toISOString(),
          locked: false
        };
        const index = this.sales.findIndex(item => item.id === sale.id);
        if (index === -1) this.sales.unshift(sale);
        else this.sales.splice(index, 1, sale);
        this.saveList();
        enqueueSync({ type: 'Penjualan', refId: sale.id, label: `Nota ${sale.id}` });
        this.isFormOpen = false;
        this.isDetailOpen = false;
        this.selectedSale = null;
      }
    }));

    Alpine.data('kartuStokPage', () => ({
      products: [],
      sales: [],
      invoices: [],
      stocktakes: [],
      expiredEntries: [],
      movements: [],
      hasProcessed: false,
      visibleCount: 10,
      filterFrom: '',
      filterTo: '',
      productFilter: '',
      productQuery: '',
      productDropdownOpen: false,
      isDetailOpen: false,
      isEditOpen: false,
      isConfirmOpen: false,
      confirmAction: '',
      confirmMovement: null,
      selectedMovement: null,
      editForm: {},
      editProductQuery: '',
      editProductDropdownOpen: false,
      editCategoryDropdownOpen: false,
      toastMessage: '',

      init() {
        this.filterFrom = this.monthStart();
        this.filterTo = this.today();
        try {
          this.products = this.readList('kromafi.barang');
          if (!this.products.length) {
            this.products = [
              { id: 1, nama: 'Amoxicilin', hargaModal: 400, hargaJual: 500, satuan: 'Tablet', stok: 300, status: 'Aktif' },
              { id: 2, nama: 'Betametason', hargaModal: 4000, hargaJual: 5000, satuan: 'Tube', stok: 25, status: 'Aktif' },
              { id: 3, nama: 'Cetirizin', hargaModal: 300, hargaJual: 400, satuan: 'Tablet', stok: 400, status: 'Aktif' },
              { id: 4, nama: 'Paracetamol', hargaModal: 250, hargaJual: 350, satuan: 'Tablet', stok: 200, status: 'Aktif' },
              { id: 5, nama: 'Ibuprofen', hargaModal: 500, hargaJual: 700, satuan: 'Tablet', stok: 100, status: 'Aktif' },
              { id: 6, nama: 'Antasida', hargaModal: 200, hargaJual: 300, satuan: 'Tablet', stok: 150, status: 'Aktif' }
            ];
            if (localStorage.getItem('kromafi.barang') === null) localStorage.setItem('kromafi.barang', JSON.stringify(this.products));
          }
          this.sales = this.readList('kromafi.penjualan');
          this.invoices = this.readList('kromafi.fakturOrderan');
          this.stocktakes = this.readList('kromafi.stokOpname');
          this.expiredEntries = this.readList('kromafi.expiredMutasi');
        } catch (error) {
          console.error('Gagal memuat data Kartu Stok.', error);
          this.showToast('Data mutasi tidak dapat dimuat.');
        }
      },

      readList(key) {
        const stored = localStorage.getItem(key);
        if (stored === null) return [];
        const parsed = JSON.parse(stored);
        if (!Array.isArray(parsed)) throw new Error(`${key} harus berupa daftar.`);
        return parsed;
      },

      today() {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      },

      monthStart() {
        return `${this.today().slice(0, 7)}-01`;
      },

      parseAngka(value) {
        if (typeof value === 'number') return Number.isFinite(value) ? value : null;
        const raw = String(value ?? '').trim();
        if (!raw) return null;
        let normalized = raw.replace(/[^\d,.-]/g, '');
        if (normalized.includes(',')) normalized = normalized.replace(/\./g, '').replace(',', '.').replace(/,/g, '');
        else normalized = normalized.replace(/\./g, '');
        const number = Number(normalized);
        return Number.isFinite(number) ? number : null;
      },

      formatRibuan(value) {
        const number = this.parseAngka(value);
        return number === null ? '0' : new Intl.NumberFormat('id-ID', { maximumFractionDigits: 2 }).format(number);
      },

      toDateInput(value) {
        if (!value) return '';
        const raw = String(value);
        if (/^\d{4}-\d{2}-\d{2}/.test(raw)) return raw.slice(0, 10);
        const parsed = new Date(raw);
        return Number.isNaN(parsed.getTime()) ? '' : `${parsed.getFullYear()}-${String(parsed.getMonth() + 1).padStart(2, '0')}-${String(parsed.getDate()).padStart(2, '0')}`;
      },

      formatDate(value) {
        const dateValue = this.toDateInput(value);
        if (!dateValue) return '-';
        return new Intl.DateTimeFormat('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }).format(new Date(`${dateValue}T00:00:00`));
      },

      formatExpired(value) {
        if (!value) return '-';
        const raw = String(value);
        const monthYear = raw.match(/^(\d{4})-(\d{2})(?:-\d{2})?$/);
        if (monthYear) return `${monthYear[2]}/${monthYear[1]}`;
        if (/^\d{2}\/\d{4}$/.test(raw)) return raw;
        return this.formatDate(raw);
      },

      productId(product) {
        return product.id_barang ?? product.idBarang ?? product.id;
      },

      productName(product) {
        return String(product.nama_barang ?? product.namaBarang ?? product.nama ?? '');
      },

      productUnit(product) {
        return product.satuan ?? product.unit ?? 'Unit';
      },

      buildMutations(data = {}) {
        const products = data.products || this.products;
        const sales = data.sales || this.sales;
        const invoices = data.invoices || this.invoices;
        const stocktakes = data.stocktakes || this.stocktakes;
        const expiredEntries = data.expiredEntries || this.expiredEntries;
        const productById = new Map(products.map(product => [String(this.productId(product)), product]));
        const productIdFor = item => {
          if (item.kartuStokProductId !== undefined && item.kartuStokProductId !== null && item.kartuStokProductId !== '') return item.kartuStokProductId;
          const itemId = item.productId ?? item.id_barang ?? item.idBarang;
          if (itemId !== undefined && itemId !== null && itemId !== '') return itemId;
          const itemName = String(item.nama_barang ?? item.namaBarang ?? item.nama ?? '').toLocaleLowerCase('id');
          const match = products.find(product => this.productName(product).toLocaleLowerCase('id') === itemName);
          return match ? this.productId(match) : '';
        };
        const result = [];
        const addLine = (item, parent, sourceType, parentIndex, lineIndex) => {
          if (sourceType === 'sale' && item.jenis === 'jasa') return;
          if (item.kartuStokHapus === true) return;
          const productId = productIdFor(item);
          const storedQuantity = this.parseAngka(item.kartuStokJumlah);
          const baseQuantity = this.parseAngka(item.jumlah ?? item.selisih);
          if (productId === '' || (storedQuantity === null && baseQuantity === null && sourceType !== 'stocktake')) return;
          const category = item.kartuStokKategori || (sourceType === 'sale' ? 'Penjualan' : sourceType === 'invoice' ? 'Orderan' : 'Penyesuaian');
          let quantity = storedQuantity;
          if (quantity === null) {
            if (sourceType === 'sale') quantity = -Math.abs(this.parseAngka(item.jumlah) || 0);
            else if (sourceType === 'invoice') quantity = Math.abs(this.parseAngka(item.jumlah) || 0);
            else quantity = this.parseAngka(item.selisih ?? item.perubahan ?? item.adjustment ?? item.jumlah);
          }
          if (quantity === null && sourceType === 'stocktake' && item.stokFisik !== undefined && item.stokSistem !== undefined) {
            quantity = (this.parseAngka(item.stokFisik) || 0) - (this.parseAngka(item.stokSistem) || 0);
          }
          if (quantity === null) return;
          const lineId = item.id === undefined ? lineIndex : item.id;
          const parentId = parent.id === undefined ? parentIndex : parent.id;
          const product = productById.get(String(productId));
          const date = item.kartuStokTanggal || parent.tanggal || parent.tanggalFaktur || parent.tanggalTransaksi || parent.date || parent.waktu || item.tanggal || '';
          result.push({
            id: `${sourceType}:${parentId}:${lineId}`,
            sourceType,
            parentIndex,
            lineIndex,
            productId,
            nama: item.kartuStokNama || item.nama_barang || item.namaBarang || item.nama || (product && this.productName(product)) || 'Barang tidak diketahui',
            satuan: item.kartuStokSatuan || item.satuan || (product && this.productUnit(product)) || 'Unit',
            quantity,
            category,
            date: this.toDateInput(date),
            reference: String(parent.nomorFaktur || parent.nomorNota || parent.nomor || parent.id || '-').toLocaleUpperCase('id'),
            batch: item.kartuStokBatch ?? item.batch ?? item.nomorBatch ?? '',
            expired: item.kartuStokExpired ?? item.tanggalExpired ?? item.expired ?? item.tanggalKedaluwarsa ?? '',
            staff: item.kartuStokPetugas || parent.petugasNama || parent.namaPetugas || parent.petugas || '-',
            note: item.kartuStokCatatan ?? parent.catatan ?? item.catatan ?? '',
            locked: !!parent.locked || (sourceType === 'invoice' && String(parent.status_pelunasan || parent.statusPelunasan || '').toLocaleLowerCase('id') === 'lunas')
          });
        };
        sales.forEach((sale, parentIndex) => (Array.isArray(sale.items) ? sale.items : []).forEach((item, lineIndex) => addLine(item, sale, 'sale', parentIndex, lineIndex)));
        invoices.forEach((invoice, parentIndex) => (Array.isArray(invoice.items) ? invoice.items : []).forEach((item, lineIndex) => addLine(item, invoice, 'invoice', parentIndex, lineIndex)));
        stocktakes.forEach((entry, parentIndex) => {
          if (Array.isArray(entry.items)) entry.items.forEach((item, lineIndex) => addLine(item, entry, 'stocktake', parentIndex, lineIndex));
          else addLine(entry, entry, 'stocktake', parentIndex, 0);
        });
        expiredEntries.forEach((entry, parentIndex) => {
          if (Array.isArray(entry.items)) entry.items.forEach((item, lineIndex) => addLine(item, entry, 'expired', parentIndex, lineIndex));
          else addLine(entry, entry, 'expired', parentIndex, 0);
        });
        return result.sort((a, b) => (a.date || '9999-12-31').localeCompare(b.date || '9999-12-31') || a.id.localeCompare(b.id, 'id', { numeric: true, sensitivity: 'base' }));
      },

      get isAdmin() {
        try {
          const username = (localStorage.getItem('kromafi.loggedInUser') || '').trim().toLocaleLowerCase('id');
          const staff = this.readList('kromafi.petugas').find(item => String(item.username || '').trim().toLocaleLowerCase('id') === username);
          return !!staff && String(staff.role || '').trim().toLocaleLowerCase('id') === 'admin';
        } catch (error) {
          console.error('Gagal memeriksa izin Kartu Stok.', error);
          return false;
        }
      },

      get productOptions() {
        return this.products.filter(product => (product.status ?? product.status_barang) === 'Aktif')
          .sort((a, b) => this.productName(a).localeCompare(this.productName(b), 'id', { sensitivity: 'base' }));
      },

      get editProductOptions() {
        const query = (this.editProductQuery || '').trim().toLocaleLowerCase('id');
        return this.productOptions.filter(product => !query || this.productName(product).toLocaleLowerCase('id').includes(query)).slice(0, 10);
      },

      get filteredProductOptions() {
        const query = (this.productQuery || '').trim().toLocaleLowerCase('id');
        return this.productOptions.filter(product => !query || this.productName(product).toLocaleLowerCase('id').includes(query)).slice(0, 10);
      },

      get dateRangeDays() {
        if (!this.filterFrom || !this.filterTo) return 0;
        const from = Date.parse(`${this.filterFrom}T00:00:00Z`);
        const to = Date.parse(`${this.filterTo}T00:00:00Z`);
        return Number.isFinite(from) && Number.isFinite(to) ? Math.floor((to - from) / 86400000) + 1 : 0;
      },

      get filterError() {
        if (!this.filterFrom || !this.filterTo) return 'Tanggal dari dan sampai wajib diisi.';
        if (this.filterFrom > this.filterTo) return 'Tanggal dari tidak boleh melewati tanggal sampai.';
        if (this.dateRangeDays > 31) return 'Rentang maksimal 31 hari';
        if (!this.productFilter) return 'Pilih nama obat untuk melihat kartu stok.';
        return '';
      },

      get selectedProductName() {
        if (!this.productFilter) return 'Pilih obat';
        const product = this.products.find(item => String(this.productId(item)) === String(this.productFilter));
        return product ? this.productName(product) : 'Pilih obat';
      },

      get filteredMovements() {
        if (!this.hasProcessed) return [];
        return this.movements.filter(item => item.date >= this.filterFrom && item.date <= this.filterTo && String(item.productId) === String(this.productFilter));
      },

      get visibleMovements() {
        return this.filteredMovements.slice(0, this.visibleCount);
      },

      get mutationRows() {
        return this.visibleMovements;
      },

      get hasMore() {
        return this.filteredMovements.length > this.visibleCount;
      },

      get isNoMovementForProduct() {
        return !!this.productFilter && this.hasProcessed && !this.movements.some(item => String(item.productId) === String(this.productFilter));
      },

      get isEmptyLedger() {
        return this.hasProcessed && this.movements.length === 0;
      },

      get runningTotal() {
        return this.filteredMovements.reduce((sum, item) => sum + item.quantity, 0);
      },

      filterChanged() {
        this.hasProcessed = false;
        this.visibleCount = 10;
      },

      toggleProductDropdown() {
        this.productDropdownOpen = !this.productDropdownOpen;
        if (this.productDropdownOpen && this.productQuery === this.selectedProductName) this.productQuery = '';
      },

      searchProductFilter() {
        this.productFilter = '';
        this.productDropdownOpen = true;
      },

      closeProductDropdown() {
        this.productDropdownOpen = false;
        if (this.productFilter) this.productQuery = this.selectedProductName;
      },

      selectProductFilter(product) {
        this.productFilter = product ? String(this.productId(product)) : '';
        this.productQuery = product ? this.productName(product) : '';
        this.productDropdownOpen = false;
        this.filterChanged();
      },

      stockBases(products, movements) {
        const net = new Map();
        movements.forEach(item => net.set(String(item.productId), (net.get(String(item.productId)) || 0) + item.quantity));
        return new Map(products.map(product => {
          const productId = String(this.productId(product));
          return [productId, (this.parseAngka(product.stok ?? product.stok_akhir) || 0) - (net.get(productId) || 0)];
        }));
      },

      processFilters() {
        if (this.filterError) return;
        const all = this.buildMutations();
        const bases = this.stockBases(this.products, all);
        const balances = new Map(bases);
        this.movements = all.map(item => {
          const opening = balances.get(String(item.productId)) || 0;
          const closing = opening + item.quantity;
          balances.set(String(item.productId), closing);
          return { ...item, opening, closing };
        });
        this.hasProcessed = true;
        this.visibleCount = 10;
        if (!this.movements.some(item => String(item.productId) === String(this.productFilter))) this.showToast('Belum ada mutasi untuk obat ini.');
      },

      showDetail(movement) {
        this.selectedMovement = movement;
        this.isDetailOpen = true;
        this.$nextTick(() => { if (this.$refs.detailModalScroll) this.$refs.detailModalScroll.scrollTop = 0; });
      },

      closeDetail() {
        this.isDetailOpen = false;
      },

      canModify(movement) {
        if (!movement || !this.isEditableCategory(movement)) return false;
        if (movement.sourceType === 'sale' || movement.sourceType === 'invoice') return false;
        if (movement.sourceType === 'stocktake') return this.isAdmin;
        return !movement.locked;
      },

      isEditableCategory(movement) {
        const category = String(movement && movement.category || '').trim().toLocaleLowerCase('id');
        return ['stok opname', 'retur', 'pemusnahan'].includes(category);
      },

      openEdit(movement) {
        if (!this.canModify(movement)) return;
        this.editForm = {
          id: movement.id,
          date: movement.date,
          category: movement.category,
          productId: String(movement.productId),
          quantity: movement.quantity,
          batch: movement.batch,
          expired: this.toDateInput(movement.expired),
          note: movement.note
        };
        this.editProductDropdownOpen = false;
        this.editProductQuery = movement.nama;
        this.editCategoryDropdownOpen = false;
        this.isDetailOpen = false;
        this.isEditOpen = true;
        this.$nextTick(() => { if (this.$refs.editModalScroll) this.$refs.editModalScroll.scrollTop = 0; });
      },

      closeEdit() {
        this.isEditOpen = false;
        this.editProductDropdownOpen = false;
        this.editProductQuery = '';
        this.editCategoryDropdownOpen = false;
      },

      selectEditProduct(product) {
        this.editForm.productId = String(this.productId(product));
        this.editProductDropdownOpen = false;
        this.editProductQuery = this.productName(product);
      },

      toggleEditProductDropdown() {
        this.editProductDropdownOpen = !this.editProductDropdownOpen;
        if (this.editProductDropdownOpen) {
          const selected = this.products.find(product => String(this.productId(product)) === String(this.editForm.productId));
          if (selected && this.editProductQuery === this.productName(selected)) this.editProductQuery = '';
        } else if (this.editForm.productId) {
          const selected = this.products.find(product => String(this.productId(product)) === String(this.editForm.productId));
          this.editProductQuery = selected ? this.productName(selected) : '';
        }
      },

      searchEditProduct() {
        this.editForm.productId = '';
        this.editProductDropdownOpen = true;
      },

      closeEditProductDropdown() {
        this.editProductDropdownOpen = false;
        const selected = this.products.find(product => String(this.productId(product)) === String(this.editForm.productId));
        this.editProductQuery = selected ? this.productName(selected) : '';
      },

      selectEditCategory(category) {
        this.editForm.category = category;
        this.editCategoryDropdownOpen = false;
      },

      loggedInStaffName() {
        const username = (localStorage.getItem('kromafi.loggedInUser') || '').trim().toLocaleLowerCase('id');
        try {
          const staff = this.readList('kromafi.petugas').find(item => String(item.username || '').trim().toLocaleLowerCase('id') === username);
          return staff ? staff.nama : (localStorage.getItem('kromafi.loggedInUser') || '-');
        } catch (error) {
          console.error('Gagal membaca petugas aktif.', error);
          return localStorage.getItem('kromafi.loggedInUser') || '-';
        }
      },

      getDataSnapshot() {
        return {
          products: JSON.parse(JSON.stringify(this.products)),
          sales: JSON.parse(JSON.stringify(this.sales)),
          invoices: JSON.parse(JSON.stringify(this.invoices)),
          stocktakes: JSON.parse(JSON.stringify(this.stocktakes)),
          expiredEntries: JSON.parse(JSON.stringify(this.expiredEntries))
        };
      },

      persistSnapshot(snapshot, sourceType) {
        const keys = ['kromafi.barang', 'kromafi.penjualan', 'kromafi.fakturOrderan', 'kromafi.stokOpname', 'kromafi.expiredMutasi'];
        const previous = {};
        keys.forEach(key => { previous[key] = localStorage.getItem(key); });
        try {
          const previousMovements = this.buildMutations();
          const bases = this.stockBases(this.products, previousMovements);
          const newMovements = this.buildMutations(snapshot);
          const net = new Map();
          newMovements.forEach(item => net.set(String(item.productId), (net.get(String(item.productId)) || 0) + item.quantity));
          snapshot.products = snapshot.products.map(product => {
            const productId = String(this.productId(product));
            return { ...product, stok: (bases.get(productId) || 0) + (net.get(productId) || 0) };
          });
          localStorage.setItem('kromafi.barang', JSON.stringify(snapshot.products));
          localStorage.setItem('kromafi.penjualan', JSON.stringify(snapshot.sales));
          localStorage.setItem('kromafi.fakturOrderan', JSON.stringify(snapshot.invoices));
          localStorage.setItem('kromafi.stokOpname', JSON.stringify(snapshot.stocktakes));
          localStorage.setItem('kromafi.expiredMutasi', JSON.stringify(snapshot.expiredEntries));
        } catch (error) {
          keys.forEach(key => {
            try {
              if (previous[key] === null) localStorage.removeItem(key);
              else localStorage.setItem(key, previous[key]);
            } catch (rollbackError) {
              console.error(`Gagal memulihkan ${key} setelah penyimpanan gagal.`, rollbackError);
            }
          });
          console.error(`Gagal menyimpan perubahan mutasi ${sourceType}.`, error);
          this.showToast('Perubahan mutasi gagal disimpan.');
          return false;
        }
        this.products = snapshot.products;
        this.sales = snapshot.sales;
        this.invoices = snapshot.invoices;
        this.stocktakes = snapshot.stocktakes;
        this.expiredEntries = snapshot.expiredEntries;
        return true;
      },

      locateMutation(snapshot, movement) {
        const list = movement.sourceType === 'sale' ? snapshot.sales : movement.sourceType === 'invoice' ? snapshot.invoices : movement.sourceType === 'expired' ? snapshot.expiredEntries : snapshot.stocktakes;
        const parent = list[movement.parentIndex];
        if (!parent) return null;
        const lines = Array.isArray(parent.items) ? parent.items : [parent];
        const line = lines[movement.lineIndex];
        return line ? { parent, line } : null;
      },

      requestMutationConfirmation(action, movement = null) {
        this.confirmAction = action;
        this.confirmMovement = movement;
        this.isConfirmOpen = true;
      },

      cancelMutationConfirmation() {
        this.isConfirmOpen = false;
        this.confirmAction = '';
        this.confirmMovement = null;
      },

      confirmMutation() {
        const action = this.confirmAction;
        const movement = this.confirmMovement;
        this.cancelMutationConfirmation();
        if (action === 'save') this.saveEdit(true);
        else if (action === 'delete' && movement) this.deleteMovement(movement, true);
      },

      saveEdit(confirmed = false) {
        if (!confirmed) {
          this.requestMutationConfirmation('save');
          return;
        }
        const movement = this.buildMutations().find(item => item.id === this.editForm.id);
        const quantity = this.parseAngka(this.editForm.quantity);
        const product = this.productOptions.find(item => String(this.productId(item)) === String(this.editForm.productId));
        if (!movement || !this.canModify(movement)) {
          this.showToast('Mutasi tidak dapat diubah.');
          return;
        }
        if (!this.editForm.date || !product || quantity === null || quantity === 0) {
          this.showToast('Lengkapi tanggal, obat, dan jumlah mutasi.');
          return;
        }
        const snapshot = this.getDataSnapshot();
        const target = this.locateMutation(snapshot, movement);
        if (!target) {
          this.showToast('Data sumber mutasi tidak ditemukan.');
          return;
        }
        if (movement.sourceType === 'stocktake') {
          target.line.kartuStokJumlah = quantity;
          target.line.kartuStokKategori = this.editForm.category;
        } else {
          if (movement.sourceType !== 'stocktake' && (target.parent.locked || (movement.sourceType === 'invoice' && String(target.parent.status_pelunasan || target.parent.statusPelunasan || '').toLocaleLowerCase('id') === 'lunas'))) {
            this.showToast('Transaksi terkunci dan tidak dapat diubah.');
            return;
          }
          target.line.kartuStokJumlah = quantity;
          target.line.kartuStokKategori = this.editForm.category;
        }
        target.line.kartuStokProductId = this.productId(product);
        target.line.kartuStokNama = this.productName(product);
        target.line.kartuStokSatuan = this.productUnit(product);
        target.line.kartuStokBatch = this.editForm.batch;
        target.line.kartuStokExpired = this.editForm.expired;
        target.line.kartuStokTanggal = this.editForm.date;
        target.line.kartuStokCatatan = this.editForm.note;
        target.line.kartuStokPetugas = this.loggedInStaffName();
        if (!this.persistSnapshot(snapshot, movement.sourceType)) return;
        enqueueSync({ type: 'Penyesuaian stok', refId: movement.id, label: `Ubah mutasi ${movement.nama || movement.name || ''}`.trim() });
        this.closeEdit();
        this.selectedMovement = null;
        this.processFilters();
        this.showToast('Mutasi berhasil diubah dan stok diperbarui.');
      },

      deleteMovement(movement, confirmed = false) {
        if (!this.canModify(movement)) return;
        if (!confirmed) {
          this.requestMutationConfirmation('delete', movement);
          return;
        }
        const snapshot = this.getDataSnapshot();
        const target = this.locateMutation(snapshot, movement);
        if (!target) {
          this.showToast('Data sumber mutasi tidak ditemukan.');
          return;
        }
        if (target.parent.locked || (movement.sourceType === 'invoice' && String(target.parent.status_pelunasan || target.parent.statusPelunasan || '').toLocaleLowerCase('id') === 'lunas')) {
          this.showToast('Transaksi terkunci dan tidak dapat dihapus.');
          return;
        }
        target.line.kartuStokHapus = true;
        if (!this.persistSnapshot(snapshot, movement.sourceType)) return;
        enqueueSync({ type: 'Penyesuaian stok', refId: movement.id, label: `Hapus mutasi ${movement.nama || movement.name || ''}`.trim() });
        this.isDetailOpen = false;
        this.selectedMovement = null;
        this.processFilters();
        this.showToast('Mutasi dihapus dan stok diperbarui.');
      },

      loadMore() {
        this.visibleCount += 10;
      },

      showToast(message) {
        this.toastMessage = message;
        window.setTimeout(() => { if (this.toastMessage === message) this.toastMessage = ''; }, 3000);
      }
    }));

    // Expired Page Data
    Alpine.data('expiredPage', () => ({
      invoices: [],
      transactions: [],
      products: [],
      distributorList: [],
      monthFilter: '',
      visibleCount: 10,
      isDetailOpen: false,
      isFormOpen: false,
      selectedExpired: null,
      productQuery: '',
      productDropdownOpen: false,
      formError: '',
      toastMessage: '',
      formData: { productId: '', nama: '', jumlah: '', satuan: '', tindakan: 'Pemusnahan', tanggal: '', batch: '', nomorFaktur: '', distributorId: '' },

      init() {
        this.formData.tanggal = this.today();
        this.monthFilter = this.today().slice(0, 7);
        this.loadReferences();
      },

      readList(key) {
        const stored = localStorage.getItem(key);
        if (stored === null) return [];
        const parsed = JSON.parse(stored);
        if (!Array.isArray(parsed)) throw new Error(`${key} harus berupa daftar.`);
        return parsed;
      },

      loadReferences() {
        const readList = (key, fallback) => {
          try {
            const parsed = JSON.parse(localStorage.getItem(key) || 'null');
            return Array.isArray(parsed) ? parsed : fallback;
          } catch (error) {
            return fallback;
          }
        };
        this.products = readList('kromafi.barang', []);
        try {
          this.distributorList = readDistributorList();
        } catch (error) {
          console.error('Gagal memuat daftar distributor.', error);
          this.distributorList = [];
        }
        try {
          this.invoices = this.readList('kromafi.fakturOrderan');
        } catch (error) {
          console.error('Gagal memuat data faktur orderan.', error);
          this.invoices = [];
          this.showToast('Data expired tidak dapat dimuat.');
        }
        try {
          this.transactions = this.readList('kromafi.expiredMutasi');
        } catch (error) {
          console.error('Gagal memuat transaksi expired.', error);
          this.transactions = [];
        }
      },

      today() {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      },

      parseAngka(value) {
        if (typeof value === 'number') return Number.isFinite(value) ? value : null;
        const raw = String(value ?? '').trim();
        if (!raw) return null;
        let normalized = raw.replace(/[^\d,.-]/g, '');
        if (normalized.includes(',')) normalized = normalized.replace(/\./g, '').replace(',', '.').replace(/,/g, '');
        else normalized = normalized.replace(/\./g, '');
        const number = Number(normalized);
        return Number.isFinite(number) ? number : null;
      },

      formatRibuan(value) {
        const number = this.parseAngka(value);
        return number === null ? '0' : new Intl.NumberFormat('id-ID', { maximumFractionDigits: 2 }).format(number);
      },

      toDateInput(value) {
        if (!value) return '';
        const raw = String(value);
        if (/^\d{4}-\d{2}-\d{2}/.test(raw)) return raw.slice(0, 10);
        const parsed = new Date(raw);
        return Number.isNaN(parsed.getTime()) ? '' : `${parsed.getFullYear()}-${String(parsed.getMonth() + 1).padStart(2, '0')}-${String(parsed.getDate()).padStart(2, '0')}`;
      },

      formatDate(value) {
        const dateValue = this.toDateInput(value);
        if (!dateValue) return '-';
        return new Intl.DateTimeFormat('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }).format(new Date(`${dateValue}T00:00:00`));
      },

      formatMonth(value) {
        if (!value) return '';
        return new Intl.DateTimeFormat('id-ID', { month: 'long', year: 'numeric' }).format(new Date(`${value}-01T00:00:00`));
      },

      productId(product) {
        return product.id_barang ?? product.idBarang ?? product.id;
      },

      productName(product) {
        return String(product.nama_barang ?? product.namaBarang ?? product.nama ?? '');
      },

      productUnit(product) {
        return product.satuan ?? product.unit ?? 'Unit';
      },

      loggedInStaffName() {
        const username = (localStorage.getItem('kromafi.loggedInUser') || '').trim().toLocaleLowerCase('id');
        try {
          const staff = this.readList('kromafi.petugas').find(item => String(item.username || '').trim().toLocaleLowerCase('id') === username);
          return staff ? staff.nama : (localStorage.getItem('kromafi.loggedInUser') || '-');
        } catch (error) {
          console.error('Gagal membaca petugas aktif.', error);
          return localStorage.getItem('kromafi.loggedInUser') || '-';
        }
      },

      get expiredRows() {
        const rows = [];
        this.invoices.forEach((invoice, parentIndex) => {
          const lines = Array.isArray(invoice.items) ? invoice.items : [];
          lines.forEach((line, lineIndex) => {
            const expired = this.toDateInput(line.tanggalExpired ?? line.expired ?? line.tanggalKedaluwarsa ?? '');
            if (!expired) return;
            const lineProductId = line.productId ?? line.id_barang ?? line.idBarang ?? '';
            const product = this.products.find(item => String(this.productId(item)) === String(lineProductId));
            rows.push({
              id: `expired:${invoice.id ?? parentIndex}:${line.id ?? lineIndex}`,
              parentIndex,
              lineIndex,
              invoiceId: invoice.id ?? '',
              productId: lineProductId || (product ? this.productId(product) : ''),
              nama: line.nama || line.namaBarang || line.nama_barang || (product && this.productName(product)) || 'Barang tidak diketahui',
              satuan: line.satuan || (product && this.productUnit(product)) || 'Unit',
              jumlah: this.parseAngka(line.jumlah) || 0,
              tanggalExpired: expired,
              tanggalFaktur: this.toDateInput(invoice.tanggalFaktur),
              distributorNama: invoice.distributorNama || '-',
              nomorFaktur: String(invoice.nomorFaktur || '-').toLocaleUpperCase('id'),
              batch: line.batch || line.nomorBatch || '-'
            });
          });
        });
        const filtered = this.monthFilter ? rows.filter(row => row.tanggalExpired.slice(0, 7) === this.monthFilter) : [];
        return filtered.sort((a, b) => a.tanggalExpired.localeCompare(b.tanggalExpired) || a.nama.localeCompare(b.nama, 'id', { sensitivity: 'base' }));
      },

      get visibleExpired() {
        return this.expiredRows.slice(0, this.visibleCount);
      },

      get hasMore() {
        return this.expiredRows.length > this.visibleCount;
      },

      get selectedMonthLabel() {
        return this.monthFilter ? this.formatMonth(this.monthFilter) : 'Pilih bulan';
      },

      get emptyStateMessage() {
        return 'Tidak ada barang expired di bulan ini';
      },

      get productOptions() {
        return [...this.products]
          .filter(item => String(item.status ?? item.status_barang ?? 'Aktif').trim().toLocaleLowerCase('id') !== 'tidak aktif')
          .sort((a, b) => this.productName(a).localeCompare(this.productName(b), 'id', { sensitivity: 'base' }));
      },

      get filteredProductOptions() {
        const query = (this.productQuery || '').trim().toLocaleLowerCase('id');
        return this.productOptions.filter(product => !query || this.productName(product).toLocaleLowerCase('id').includes(query)).slice(0, 10);
      },

      get distributorOptions() {
        return this.distributorList
          .filter(item => String(item.status || '').trim().toLocaleLowerCase('id') === 'aktif')
          .sort((a, b) => String(a.nama || '').localeCompare(String(b.nama || ''), 'id', { sensitivity: 'base' }));
      },

      daysUntilExpiry(row) {
        const target = Date.parse(`${row.tanggalExpired}T00:00:00`);
        const now = Date.parse(`${this.today()}T00:00:00`);
        return Number.isFinite(target) && Number.isFinite(now) ? Math.round((target - now) / 86400000) : null;
      },

      expiryBadgeLabel(row) {
        const days = this.daysUntilExpiry(row);
        if (days === null) return '-';
        if (days < 0) return `Kedaluwarsa ${Math.abs(days)} hari`;
        if (days === 0) return 'Kedaluwarsa hari ini';
        return `${days} hari lagi`;
      },

      expiryBadgeClass(row) {
        const days = this.daysUntilExpiry(row);
        if (days === null || days < 0) return 'bg-red-100 text-red-700 border-red-200';
        if (days <= 7) return 'bg-amber-100 text-amber-800 border-amber-200';
        if (days <= 30) return 'bg-green-100 text-green-700 border-green-200';
        return 'bg-brand-bg text-brand-secondary border-brand-border';
      },

      processedLabel(row) {
        const match = this.transactions.find(item => String(item.productId) === String(row.productId) && String(item.batch || '-') === String(row.batch) && String(item.nomorFaktur || '-') === String(row.nomorFaktur));
        return match ? `Sudah ${String(match.tindakan || '').toLocaleLowerCase('id')}` : 'Belum diproses';
      },

      openSourceInvoice() {
        if (!this.selectedExpired || this.selectedExpired.invoiceId === '') return;
        this.closeDetail();
        window.dispatchEvent(new CustomEvent('tagihan-open-invoice-detail', { detail: this.selectedExpired.invoiceId }));
      },

      loadMore() {
        this.visibleCount += 10;
      },

      openDetail(row) {
        this.selectedExpired = row;
        this.isDetailOpen = true;
        this.$nextTick(() => { if (this.$refs.expiredDetailScroll) this.$refs.expiredDetailScroll.scrollTop = 0; });
      },

      closeDetail() {
        this.isDetailOpen = false;
      },

      toggleProductDropdown() {
        this.productDropdownOpen = !this.productDropdownOpen;
        if (this.productDropdownOpen && !this.formData.productId) this.productQuery = '';
      },

      closeProductDropdown() {
        this.productDropdownOpen = false;
      },

      selectProduct(product) {
        this.formData.productId = this.productId(product);
        this.formData.nama = this.productName(product);
        this.formData.satuan = this.productUnit(product);
        this.productQuery = this.formData.nama;
        this.productDropdownOpen = false;
        this.formError = '';
      },

      openForm(row = null) {
        this.formError = '';
        this.productDropdownOpen = false;
        const prefilled = row
          ? {
            productId: row.productId || '',
            nama: row.nama || '',
            jumlah: row.jumlah ? String(row.jumlah) : '',
            satuan: row.satuan || '',
            tindakan: 'Pemusnahan',
            tanggal: this.today(),
            batch: row.batch === '-' ? '' : row.batch,
            nomorFaktur: row.nomorFaktur === '-' ? '' : row.nomorFaktur,
            distributorId: ''
          }
          : { productId: '', nama: '', jumlah: '', satuan: '', tindakan: 'Pemusnahan', tanggal: this.today(), batch: '', nomorFaktur: '', distributorId: '' };
        const distributor = prefilled.nomorFaktur ? this.invoices.find(invoice => String(invoice.nomorFaktur || '').toLocaleUpperCase('id') === prefilled.nomorFaktur.toLocaleUpperCase('id')) : null;
        this.formData = { ...prefilled, distributorId: distributor && distributor.distributorId !== undefined ? distributor.distributorId : '' };
        this.productQuery = this.formData.nama;
        this.isDetailOpen = false;
        this.isFormOpen = true;
        this.$nextTick(() => { if (this.$refs.expiredFormScroll) this.$refs.expiredFormScroll.scrollTop = 0; });
      },

      closeForm() {
        this.isFormOpen = false;
        this.productDropdownOpen = false;
      },

      saveTransaction() {
        this.formError = '';
        const product = this.productOptions.find(item => String(this.productId(item)) === String(this.formData.productId));
        const jumlah = this.parseAngka(this.formData.jumlah);
        const distributor = this.distributorOptions.find(item => String(item.id) === String(this.formData.distributorId));
        if (!product) { this.formError = 'Nama barang wajib diisi.'; return; }
        if (jumlah === null || jumlah <= 0) { this.formError = 'Jumlah harus lebih dari 0.'; return; }
        if (!['Pemusnahan', 'Retur'].includes(this.formData.tindakan)) { this.formError = 'Pilih tindakan Pemusnahan atau Retur.'; return; }
        if (!this.formData.tanggal) { this.formError = 'Tanggal wajib diisi.'; return; }
        if (!distributor) { this.formError = 'Distributor wajib diisi.'; return; }
        const entry = {
          id: `EXP-${this.formData.tanggal.replace(/-/g, '')}-${Math.random().toString(36).slice(2, 8).toLocaleUpperCase('id')}`,
          productId: this.productId(product),
          nama: this.productName(product),
          satuan: this.formData.satuan || this.productUnit(product),
          jumlah,
          selisih: -Math.abs(jumlah),
          tindakan: this.formData.tindakan,
          kartuStokKategori: this.formData.tindakan,
          tanggal: this.formData.tanggal,
          batch: this.formData.batch,
          nomorFaktur: String(this.formData.nomorFaktur || '-').toLocaleUpperCase('id'),
          tanggalExpired: '',
          distributorNama: distributor.nama,
          petugasNama: this.loggedInStaffName(),
          waktu: new Date().toISOString()
        };
        this.transactions = [entry, ...this.transactions];
        try {
          localStorage.setItem('kromafi.expiredMutasi', JSON.stringify(this.transactions));
        } catch (error) {
          console.error('Gagal menyimpan transaksi expired.', error);
          this.transactions = this.transactions.filter(item => item.id !== entry.id);
          this.showToast('Transaksi gagal disimpan.');
          return;
        }
        enqueueSync({ type: 'Expired', refId: entry.id, label: `${entry.nama} (${entry.tindakan})` });
        this.closeForm();
        this.showToast(`Transaksi ${entry.tindakan.toLocaleLowerCase('id')} tersimpan.`);
      },

      showToast(message) {
        this.toastMessage = message;
        window.setTimeout(() => { if (this.toastMessage === message) this.toastMessage = ''; }, 3000);
      }
    }));

      get unpaidInvoices() {

      get hasUnpaidInvoices() {

      get filteredInvoices() {
        return this.invoices
          .filter(invoice => this.invoiceStatus(invoice) === 'belum lunas' || this.pendingRemovalIds[String(invoice.id)])
          .filter(invoice => this.distributorFilter === 'semua' || String(this.invoiceDistributorId(invoice)) === String(this.distributorFilter))
          .filter(invoice => this.matchesDueFilter(invoice))
          .sort((a, b) => {
            const dateA = this.invoiceJatuhTempo(a) || '9999-12-31';
            const dateB = this.invoiceJatuhTempo(b) || '9999-12-31';
            const dateOrder = dateA.localeCompare(dateB);
            if (dateOrder) return dateOrder;
            const nameOrder = this.invoiceDistributorName(a).localeCompare(this.invoiceDistributorName(b), 'id', { sensitivity: 'base' });
            if (nameOrder) return nameOrder;
            return this.invoiceNumber(a).localeCompare(this.invoiceNumber(b), 'id', { sensitivity: 'base' });
          });
      },

      get visibleInvoices() {
        return this.filteredInvoices.slice(0, this.visibleCount);

      get hasMore() {
        return this.filteredInvoices.length > this.visibleCount;

      get totalFilteredTagihan() {
        return this.filteredInvoices
          .filter(invoice => this.invoiceStatus(invoice) === 'belum lunas')
          .reduce((sum, invoice) => sum + this.invoiceTotal(invoice), 0);
      },

      today() {
        const date = new Date();
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
      },

      invoiceStatus(invoice) {
        return String(invoice.statusPelunasan ?? invoice.status_pelunasan ?? '').trim().toLocaleLowerCase('id');
      },

      invoiceDistributorId(invoice) {
        return invoice.distributorId ?? invoice.distributor_id ?? '';
      },

      invoiceJatuhTempo(invoice) {
        return String(invoice.jatuhTempo ?? invoice.jatuh_tempo ?? '');

      invoiceNumber(invoice) {

      invoiceTotal(invoice) {

        if (value !== undefined && value !== null && value !== '') {
          const parsed = this.parseAngka(value);
          if (parsed !== null) return parsed;
        }
        return (Array.isArray(invoice.items) ? invoice.items : [])
          .reduce((sum, item) => sum + (this.parseAngka(item.tagihan) || 0), 0);

      localDate(value) {
        if (!value) return null;
        const parts = String(value).slice(0, 10).split('-').map(Number);
        if (parts.length !== 3 || parts.some(part => !Number.isFinite(part))) return null;
        const date = new Date(parts[0], parts[1] - 1, parts[2]);
        return Number.isNaN(date.getTime()) ? null : date;

      matchesDueFilter(invoice) {
        if (this.dueFilter === 'semua') return true;
        const dueDate = this.localDate(this.invoiceJatuhTempo(invoice));
        if (!dueDate) return false;
        const today = this.localDate(this.today());
        const dueKey = this.dateKey(dueDate);
        const todayKey = this.dateKey(today);
        if (this.dueFilter === 'hari-ini') return dueKey === todayKey;
        if (this.dueFilter === 'lewat-tempo') return dueKey < todayKey;
        if (this.dueFilter === 'minggu-ini') {
          const start = new Date(today.getFullYear(), today.getMonth(), today.getDate());
          start.setDate(start.getDate() - ((start.getDay() + 6) % 7));
          const end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 7);
          return dueDate >= start && dueDate < end;
        }
        if (this.dueFilter === 'bulan-ini') {
          return dueDate.getFullYear() === today.getFullYear() && dueDate.getMonth() === today.getMonth();
        }
        return true;
      },

      dateKey(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
      },

      isOverdue(invoice) {
        const dueDate = this.invoiceJatuhTempo(invoice);
        return !!dueDate && dueDate < this.today();
      },

      isDueToday(invoice) {
        return !!this.invoiceJatuhTempo(invoice) && this.invoiceJatuhTempo(invoice) === this.today();

      formatDate(value) {
        const date = this.localDate(value);
        return date ? new Intl.DateTimeFormat('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }).format(date) : '-';
      },

      formatRibuan(value) {

      parseAngka(value) {
        if (typeof value === 'number') return Number.isFinite(value) ? value : null;
        const raw = String(value ?? '').trim();
        if (!raw) return null;
        let normalized = raw.replace(/[^\d,.-]/g, '');
        if (normalized.includes(',')) normalized = normalized.replace(/\./g, '').replace(',', '.').replace(/,/g, '');
        else normalized = normalized.replace(/\./g, '');
        const number = Number(normalized);
        return Number.isFinite(number) ? number : null;

      showToast(message) {

        this.invoices.splice(index, 1, paidInvoice);

        setTimeout(() => { delete this.pendingRemovalIds[String(paidInvoice.id)]; }, 300);

      formatRibuan(value) {

      parseAngka(value) {
        if (typeof value === 'number') return Number.isFinite(value) ? value : null;
        const raw = String(value ?? '').trim();
        if (!raw) return null;
        let normalized = raw.replace(/[^\d,.-]/g, '');
        if (normalized.includes(',')) {
          normalized = normalized.replace(/\./g, '').replace(',', '.').replace(/,/g, '');
        } else {
          normalized = normalized.replace(/\./g, '');

        const number = Number(normalized);
        return Number.isFinite(number) ? number : null;

      formatPersen(value) {

        return number === null ? '' : new Intl.NumberFormat('id-ID', { useGrouping: false, maximumFractionDigits: 20 }).format(number);
      },

      normalizeInputValue(value, grouped) {
        let raw = String(value ?? '').replace(/[^\d.,-]/g, '');
        if (grouped) {
          if (!raw.includes(',') && raw.includes('.')) {
            const lastDot = raw.lastIndexOf('.');
            const decimals = raw.length - lastDot - 1;
            if (decimals <= 2) raw = raw.slice(0, lastDot).replace(/\./g, '') + ',' + raw.slice(lastDot + 1);
          }
          const decimalIndex = raw.indexOf(',');
          if (decimalIndex !== -1) raw = raw.slice(0, decimalIndex).replace(/\./g, '') + ',' + raw.slice(decimalIndex + 1).replace(/[,.]/g, '');
          else raw = raw.replace(/[,.]/g, '');
          return raw;
        }
        if (raw.includes(',')) {
          const decimalIndex = raw.indexOf(',');
          raw = raw.slice(0, decimalIndex).replace(/[,.]/g, '') + ',' + raw.slice(decimalIndex + 1).replace(/[,.]/g, '');
        } else if (raw.includes('.')) {
          const decimalIndex = raw.lastIndexOf('.');
          raw = raw.slice(0, decimalIndex).replace(/[,.]/g, '') + ',' + raw.slice(decimalIndex + 1).replace(/[,.]/g, '');
        }
        return raw;
      },

      formatInput(event, field, grouped) {
        const input = event.target;
        const original = input.value;
        const caret = input.selectionStart ?? original.length;
        const digitsBefore = (original.slice(0, caret).match(/\d/g) || []).length;
        const decimalBefore = original.slice(0, caret).includes(',');
        const normalized = this.normalizeInputValue(original, grouped);
        const number = this.parseAngka(normalized);
        let formatted = number === null ? '' : grouped ? this.formatRibuan(number) : this.formatPersen(number);
        if (normalized.endsWith(',') && !formatted.includes(',')) formatted += ',';
        this.lineForm[field] = formatted;
        input.value = formatted;
        let nextCaret = 0;
        let digitCount = 0;
        while (nextCaret < formatted.length && digitCount < digitsBefore) {
          if (/\d/.test(formatted[nextCaret])) digitCount += 1;
          nextCaret += 1;
        }
        if (decimalBefore && formatted[nextCaret] === ',') nextCaret += 1;
        input.setSelectionRange(nextCaret, nextCaret);
        if (['hargaBeli', 'diskon', 'ppn', 'margin'].includes(field)) this.updateHargaJual();

        const taxable = price - discount;

        if (this.lineForm.kemasan === 'per box' && !(this.parseAngka(this.lineForm.isiPerBox) > 0)) return '';

        if (invoiceIndex === -1) {
          this.markPaidError = 'Faktur tidak ditemukan.';
          return;

        const previous = this.invoices[invoiceIndex];
        const invoice = {

          statusPelunasan: 'Lunas',
          status_pelunasan: 'Lunas',
          tanggalPelunasan: this.paymentDateDraft,
          tanggal_pelunasan: this.paymentDateDraft,
          locked: true
        };
        this.invoices.splice(invoiceIndex, 1, invoice);
        if (!this.saveList()) {
          this.invoices.splice(invoiceIndex, 1, previous);
          this.selectedInvoice = this.normalizeInvoice(previous);
          this.markPaidError = 'Faktur gagal disimpan. Coba lagi.';

        if (invoiceIndex < 0) return;
        const previous = this.invoices[invoiceIndex];
        const invoice = {
          ...previous,
          statusPelunasan: 'Belum lunas',
          status_pelunasan: 'Belum lunas',
          tanggalPelunasan: '',
          tanggal_pelunasan: '',
          locked: false
        };
        this.invoices.splice(invoiceIndex, 1, invoice);

        this.selectedInvoice = this.normalizeInvoice(invoice);

          : {

        const item = {

          productId: Number(product.id),
          jumlah: this.computedLineQuantity,

    Alpine.data('paretoPage', () => ({
      filterFrom: '',
      filterTo: '',
      filterJenis: 'semua',
      searchQuery: '',
      sales: [],
      paretoItems: [],
      hasProcessed: false,
      isStale: false,
      visibleCount: 10,

      init() {
        this.initDates();
        this.loadSales();
        if (this.isValidDateRange) {
          this.processPareto();
        }
      },

      initDates() {
        const now = new Date();
        const pad = v => String(v).padStart(2, '0');
        this.filterTo = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
        this.filterFrom = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-01`;
      },

      loadSales() {
        try {
          const stored = localStorage.getItem('kromafi.penjualan');
          const parsed = stored ? JSON.parse(stored) : [];
          this.sales = Array.isArray(parsed) ? parsed : [];
        } catch (e) {
          this.sales = [];
        }
      },

      get daysDifference() {
        if (!this.filterFrom || !this.filterTo) return 0;
        const fromDate = new Date(`${this.filterFrom}T00:00:00`);
        const toDate = new Date(`${this.filterTo}T00:00:00`);
        if (isNaN(fromDate.getTime()) || isNaN(toDate.getTime())) return 0;
        const diffTime = toDate.getTime() - fromDate.getTime();
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;
        return diffDays;
      },

      get isValidDateRange() {
        return this.daysDifference >= 1 && this.daysDifference <= 31;
      },

      get dateRangeError() {
        if (!this.filterFrom || !this.filterTo) return 'Pilih tanggal awal dan akhir.';
        const diff = this.daysDifference;
        if (diff < 1) return 'Tanggal sampai harus setelah atau sama dengan dari tanggal.';
        if (diff > 31) return 'Rentang tanggal maksimal 31 hari.';
        return '';
      },

      onFilterChange() {
        this.isStale = true;
      },

      processPareto() {
        if (!this.isValidDateRange) return;
        this.loadSales();

        const map = new Map();
        const fromStr = this.filterFrom;
        const toStr = this.filterTo;
        const selectedJenis = this.filterJenis;

        this.sales.forEach(sale => {
          if (!sale || !sale.tanggal) return;
          if (sale.tanggal < fromStr || sale.tanggal > toStr) return;
          if (!Array.isArray(sale.items)) return;

          sale.items.forEach(line => {
            if (!line || !line.nama) return;
            const lineJenis = line.jenis === 'jasa' ? 'jasa' : 'barang';

            if (selectedJenis !== 'semua' && lineJenis !== selectedJenis) return;

            const lineAmount = this.parseAngka(line.tagihanFinal) ?? (this.parseAngka(line.tagihan) || 0);
            const key = line.nama.trim().toLocaleLowerCase('id');

            if (!map.has(key)) {
              map.set(key, {
                id: line.productId || line.jasaId || line.id || key,
                nama: line.nama.trim(),
                jenis: lineJenis,
                omzet: 0
              });
            }
            const itemObj = map.get(key);
            itemObj.omzet += lineAmount;
          });
        });

        const items = Array.from(map.values());
        const grandTotal = items.reduce((sum, item) => sum + item.omzet, 0);

        items.forEach(item => {
          item.persentase = grandTotal > 0 ? (item.omzet / grandTotal) * 100 : 0;
        });
        items.sort((a, b) => b.omzet - a.omzet || a.nama.localeCompare(b.nama, 'id', { sensitivity: 'base' }));

        this.paretoItems = items;
        this.hasProcessed = true;
        this.isStale = false;
        this.visibleCount = 10;
      },

      get totalOmzet() {
        return this.paretoItems.reduce((sum, item) => sum + item.omzet, 0);
      },

      get filteredItems() {
        const query = this.searchQuery.trim().toLocaleLowerCase('id');
        if (!query) return this.paretoItems;
        return this.paretoItems.filter(item => item.nama.toLocaleLowerCase('id').includes(query));
      },

      get visibleItems() {
        return this.filteredItems.slice(0, this.visibleCount);
      },

      get hasMore() {
        return this.filteredItems.length > this.visibleCount;
      },

      loadMore() {
        this.visibleCount += 10;
      },

      parseAngka(value) {
        if (typeof value === 'number') return Number.isFinite(value) ? value : null;
        const raw = String(value ?? '').trim();
        if (!raw) return null;
        let normalized = raw.replace(/[^\d,.-]/g, '');
        if (normalized.includes(',')) normalized = normalized.replace(/\./g, '').replace(',', '.').replace(/,/g, '');
        else normalized = normalized.replace(/\./g, '');
        const number = Number(normalized);
        return Number.isFinite(number) ? number : null;
      },

      formatRibuan(value) {
        const number = this.parseAngka(value);
        return number === null ? '0' : new Intl.NumberFormat('id-ID', { maximumFractionDigits: 0 }).format(number);
      },

      formatHarga(value) {
        return `Rp ${this.formatRibuan(value)}`;
      },

      formatPersen(value) {
        const num = Number(value) || 0;
        return new Intl.NumberFormat('id-ID', { minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(num) + '%';
      }
    }));

    // Forecast Page Data
    Alpine.data('forecastPage', () => ({
      filterFrom: '',
      filterTo: '',
      searchQuery: '',
      sales: [],
      products: [],
      forecastItems: [],
      hasProcessed: false,
      isStale: false,
      visibleCount: 10,

      init() {
        this.initDates();
        this.loadData();
        if (this.isValidDateRange) {
          this.processForecast();
        }
      },

      initDates() {
        const now = new Date();
        const pad = v => String(v).padStart(2, '0');
        this.filterTo = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
        const past = new Date(now.getTime() - 29 * 24 * 60 * 60 * 1000);
        this.filterFrom = `${past.getFullYear()}-${pad(past.getMonth() + 1)}-${pad(past.getDate())}`;
      },

      loadData() {
        try {
          const storedSales = localStorage.getItem('kromafi.penjualan');
          this.sales = storedSales ? JSON.parse(storedSales) : [];
        } catch (e) {
          this.sales = [];
        }
        try {
          const storedProducts = localStorage.getItem('kromafi.barang');
          const parsed = storedProducts ? JSON.parse(storedProducts) : [];
          this.products = Array.isArray(parsed) ? parsed : [];
        } catch (e) {
          this.products = [];
        }
      },

      get daysDifference() {
        if (!this.filterFrom || !this.filterTo) return 0;
        const fromDate = new Date(`${this.filterFrom}T00:00:00`);
        const toDate = new Date(`${this.filterTo}T00:00:00`);
        if (isNaN(fromDate.getTime()) || isNaN(toDate.getTime())) return 0;
        const diffTime = toDate.getTime() - fromDate.getTime();
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;
        return diffDays;
      },

      get isValidDateRange() {
        return this.daysDifference >= 1 && this.daysDifference <= 92;
      },

      get dateRangeError() {
        if (!this.filterFrom || !this.filterTo) return 'Pilih tanggal awal dan akhir.';
        const diff = this.daysDifference;
        if (diff < 1) return 'Tanggal sampai harus setelah atau sama dengan dari tanggal.';
        if (diff > 92) return 'Rentang tanggal maksimal 92 hari (3 bulan).';
        return '';
      },

      onFilterChange() {
        this.isStale = true;
      },

      processForecast() {
        if (!this.isValidDateRange) return;
        this.loadData();

        const days = this.daysDifference;
        const fromStr = this.filterFrom;
        const toStr = this.filterTo;

        const salesMap = new Map();

        (this.sales || []).forEach(sale => {
          if (!sale || !sale.tanggal) return;
          if (sale.tanggal < fromStr || sale.tanggal > toStr) return;
          if (!Array.isArray(sale.items)) return;

          sale.items.forEach(line => {
            if (!line || !line.nama) return;
            if (line.jenis === 'jasa') return;

            const qty = this.parseAngka(line.jumlah) || 0;
            const keyById = line.productId ? String(line.productId) : null;
            const keyByName = line.nama.trim().toLocaleLowerCase('id');

            if (keyById) {
              salesMap.set(keyById, (salesMap.get(keyById) || 0) + qty);
            }
            salesMap.set(keyByName, (salesMap.get(keyByName) || 0) + qty);
          });
        });

        const activeProducts = this.products.filter(p => String(p.status || '').trim().toLocaleLowerCase('id') === 'aktif');

        const result = activeProducts.map(p => {
          const keyById = String(p.id);
          const keyByName = String(p.nama || '').trim().toLocaleLowerCase('id');
          const qtySold = salesMap.get(keyById) ?? salesMap.get(keyByName) ?? 0;

          const stok = this.parseAngka(p.stok) || 0;
          const kebutuhanPerHari = qtySold / days;
          const satuan = p.satuan || 'unit';

          let ketahananHari = 0;
          let isInfinite = false;

          if (kebutuhanPerHari <= 0) {
            if (stok > 0) {
              isInfinite = true;
              ketahananHari = Infinity;
            } else {
              ketahananHari = 0;
            }
          } else {
            if (stok <= 0) {
              ketahananHari = 0;
            } else {
              ketahananHari = stok / kebutuhanPerHari;
            }
          }

          return {
            id: p.id,
            nama: p.nama,
            stok,
            satuan,
            qtySold,
            kebutuhanPerHari,
            ketahananHari,
            isInfinite
          };
        });

        result.sort((a, b) => {
          if (a.ketahananHari !== b.ketahananHari) {
            return a.ketahananHari - b.ketahananHari;
          }
          return a.nama.localeCompare(b.nama, 'id', { sensitivity: 'base' });
        });

        this.forecastItems = result;
        this.hasProcessed = true;
        this.isStale = false;
        this.visibleCount = 10;
      },

      get filteredItems() {
        const query = this.searchQuery.trim().toLocaleLowerCase('id');
        if (!query) return this.forecastItems;
        return this.forecastItems.filter(item => item.nama.toLocaleLowerCase('id').includes(query));
      },

      get visibleItems() {
        return this.filteredItems.slice(0, this.visibleCount);
      },

      get hasMore() {
        return this.filteredItems.length > this.visibleCount;
      },

      loadMore() {
        this.visibleCount += 10;
      },

      formatKetahanan(item) {
        if (item.isInfinite) return 'Tak terhingga';
        const val = Math.floor(item.ketahananHari);
        return `${this.formatRibuan(val)} hari`;
      },

      formatKebutuhan(item) {
        const num = item.kebutuhanPerHari;
        if (num === 0) return `0 ${item.satuan}/hari`;
        const formattedNum = new Intl.NumberFormat('id-ID', { maximumFractionDigits: 2 }).format(num);
        return `${formattedNum} ${item.satuan}/hari`;
      },

      parseAngka(value) {
        if (typeof value === 'number') return Number.isFinite(value) ? value : null;
        const raw = String(value ?? '').trim();
        if (!raw) return null;
        let normalized = raw.replace(/[^\d,.-]/g, '');
        if (normalized.includes(',')) normalized = normalized.replace(/\./g, '').replace(',', '.').replace(/,/g, '');
        else normalized = normalized.replace(/\./g, '');
        const number = Number(normalized);
        return Number.isFinite(number) ? number : null;
      },

      formatRibuan(value) {
        const number = this.parseAngka(value);
        return number === null ? '0' : new Intl.NumberFormat('id-ID', { maximumFractionDigits: 0 }).format(number);
      }
    }));

    Alpine.data('laporanPage', () => ({
